<title>Discos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Estantería: portadas como iconos en rejilla; lo que tiene más de un disco se ve como una pila con grosor y se abre como una carpeta.
   La interfaz es mínima (cabecera fina, un + discreto); el color solo dice el veredicto. */
:root{
  --bg:#ffffff;--fg:#1c1c1e;--muted:#8a8a8e;--line:#ececec;--soft:#f4f4f3;--field:#dcdcdc;--card:#ffffff;
  --yes:#2fb344;--no:#e5383b;--sel:#2f8cf5;--paper:#fffdf5;--edge:#cdcdd1;--edge2:#b9b9be;
  --panel:rgba(255,255,255,.92);--panel-b:rgba(0,0,0,.08);--hover:rgba(0,0,0,.05);--ov:rgba(0,0,0,.28);
  --shadow:0 1px 1px rgba(0,0,0,.08),0 6px 16px -8px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212;--fg:#ececec;--muted:#8d8d92;--line:#262626;--soft:#1c1c1c;--field:#3a3a3a;--card:#232325;
  --yes:#3ccf7a;--no:#ff5a5f;--paper:#1f1e1a;--edge:#3a3a3d;--edge2:#2e2e31;
  --panel:rgba(44,44,46,.94);--panel-b:rgba(255,255,255,.1);--hover:rgba(255,255,255,.07);--ov:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 16px -8px rgba(0,0,0,.8);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121212;--fg:#ececec;--muted:#8d8d92;--line:#262626;--soft:#1c1c1c;--field:#3a3a3a;--card:#232325;
  --yes:#3ccf7a;--no:#ff5a5f;--paper:#1f1e1a;--edge:#3a3a3d;--edge2:#2e2e31;
  --panel:rgba(44,44,46,.94);--panel-b:rgba(255,255,255,.1);--hover:rgba(255,255,255,.07);--ov:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 16px -8px rgba(0,0,0,.8);color-scheme:dark;}

*{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%;touch-action:pan-x pan-y;}
body{touch-action:pan-x pan-y;}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
body.lock{overflow:hidden;}
body::before{content:"";position:fixed;top:0;right:0;bottom:auto;left:0;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);}
button,input{font:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;}
svg{display:block;}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--sel);outline-offset:2px;}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));}

/* cabecera fina */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);}
.bar{display:flex;align-items:center;gap:6px;padding-block:12px 10px;}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:17px;font-weight:600;}
.crumb .back{display:flex;align-items:center;gap:2px;color:var(--muted);font-weight:500;font-size:16px;padding:4px 6px 4px 0;}
.crumb .back svg{width:20px;height:20px;}
.crumb .here{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumb .n{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums;}
.ib{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ib:hover{background:var(--soft);}
.ib.on{background:var(--fg);color:var(--bg);}
.ib svg{width:21px;height:21px;}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;}
.seg button{height:30px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);}
.crumb{overflow:hidden;}
.crumb .n{flex-shrink:0;}
@media (max-width:440px){ .crumb .bl,.crumb .sl{display:none;} .seg button{padding:0 9px;font-size:13.5px;} .bar{gap:0;} .bar .ib{width:33px;} .pfb{margin-right:4px;} }
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.sub{display:flex;align-items:center;gap:10px;padding-bottom:12px;}
.search input{width:100%;height:40px;border:1px solid var(--field);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px;outline:none;margin-bottom:12px;}

/* rejilla de portadas: el tamaño lo eliges tú (pellizcar, Ctrl+rueda o − +) */
main{padding-block:10px calc(90px + env(safe-area-inset-bottom,0px));touch-action:pan-x pan-y;}
.grid{--t:150px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--t),1fr));gap:calc(var(--t) * .2) calc(var(--t) * .14);}
.grid.enter{animation:enter .22s ease-out;}
@keyframes enter{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.grid.enter{animation:none;}}
.it{display:block;width:100%;min-width:0;max-width:100%;text-align:left;padding:0;}
.st{position:relative;display:block;width:100%;height:0;padding-bottom:100%;}
.cv{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:4px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);z-index:3;}
.cv img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;}
.v-o .cv{box-shadow:0 0 0 2.5px var(--yes),var(--shadow);}
.v-x .cv{box-shadow:0 0 0 2.5px var(--no),var(--shadow);}
.v-p .cv{opacity:.42;}
/* el grosor de la pila: portadas de debajo asomando hacia abajo a la derecha */
.pile .cv{top:0;right:11%;bottom:11%;left:0;}
.pile .lay{position:absolute;border-radius:4px;background:var(--edge) center/cover no-repeat;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 2px 6px -2px rgba(0,0,0,.3);}
.pile .lay::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;background:rgba(0,0,0,.12);}
.it:active .st{transform:scale(.97);}
.ph{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;justify-content:flex-end;padding:9%;color:#1c1c1e;font-size:calc(var(--t) * .085);}
.ph b{font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.ph small{opacity:.65;margin-top:3px;font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb{display:block;width:100%;max-width:100%;overflow:hidden;margin-top:8px;padding-right:6%;box-sizing:border-box;}
.lb b{display:block;width:100%;max-width:100%;font-size:13.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb small{display:block;width:100%;max-width:100%;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.grid.tiny .lb{display:none;}
.empty{color:var(--muted);text-align:center;padding:60px 10px;line-height:1.6;}

/* zoom flotante */
.zb{position:fixed;z-index:15;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;
  background:var(--panel);border-radius:22px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.12),0 0 0 .5px var(--panel-b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.zb button{width:40px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;}
.zb button:hover{background:var(--hover);}
.zb svg{width:20px;height:20px;}

/* ficha (nuevo o editar) */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--ov);z-index:50;}
.sheet{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:min(88vh,720px);display:flex;flex-direction:column;
  background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease-out;}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%);}to{opacity:1;transform:translate(-50%,-50%);}}
@media (max-width:560px){ .sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:92vh;border-radius:16px 16px 0 0;animation:none;} }
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);}
.sh-h b{flex:1;font-size:16px;}
.sh-h .x{color:var(--muted);font-size:15px;padding:6px 8px;}
.sh-h .ok{height:34px;padding:0 16px;border-radius:17px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;}
.sh-b{overflow-y:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));}
.cz{position:relative;display:flex;align-items:center;justify-content:center;width:150px;height:150px;margin:0 auto 14px;border-radius:5px;overflow:hidden;border:1.5px dashed var(--field);
  color:var(--muted);font-size:13px;line-height:1.4;text-align:center;cursor:pointer;}
.cz.has{border:0;box-shadow:var(--shadow);}
.cz.drag{border-color:var(--fg);}
.cz img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;}
.fs{display:flex;flex-direction:column;gap:8px;}
.in{width:100%;height:44px;border:1px solid var(--field);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;outline:none;}
.in:focus{border-color:var(--fg);}
.in.big{font-weight:600;font-size:17px;}
.r2{display:flex;gap:8px;}
.r2 .in{flex:1;min-width:0;}
.vb{width:52px;height:44px;border-radius:11px;border:1px solid var(--field);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
.vb svg{width:20px;height:20px;}
.vb.on.o{background:var(--yes);border-color:var(--yes);color:#fff;}
.vb.on.x{background:var(--no);border-color:var(--no);color:#fff;}
.gbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--field);border-radius:10px;padding:6px;min-height:44px;}
.gbox input{flex:1;min-width:120px;border:0;outline:none;background:none;height:30px;padding:0 6px;font-size:16px;}
.tg{display:inline-flex;align-items:center;height:30px;border-radius:15px;background:var(--soft);font-size:14px;padding-left:12px;}
.tg button{padding:0 10px 0 6px;height:100%;color:var(--muted);}
.sugg{display:flex;flex-wrap:wrap;gap:6px;}
.sugg button{height:28px;padding:0 11px;border-radius:14px;background:var(--soft);font-size:13px;color:var(--muted);}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
.btn{height:40px;padding:0 14px;border-radius:10px;background:var(--soft);font-size:14.5px;}
.btn.danger{color:var(--no);}
.btn.danger.sure{background:var(--no);color:#fff;}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:-6px;margin-bottom:12px;}

.menu{position:fixed;z-index:40;top:calc(56px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));min-width:240px;background:var(--card);border-radius:14px;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.2),0 0 0 .5px var(--line);}
.menu .mi{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:15px;cursor:pointer;}
.menu .mi:hover{background:var(--soft);}
.menu .sep{height:1px;background:var(--line);margin:5px 8px;}
.menu .danger{color:var(--no);}
/* listas para descubrir: carpetas y enlaces, en su propia página */
.lp{max-width:680px;margin:0 auto;}
.lp-h{display:flex;align-items:center;gap:6px;padding:4px 0 10px;border-bottom:1px solid var(--line);min-height:50px;}
.lp-h .tt{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px;}
.lp-h .bk{display:flex;align-items:center;color:var(--muted);font-size:15px;padding:6px 6px 6px 0;max-width:40%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:8px;}
.lp-h .bk svg{width:20px;height:20px;flex-shrink:0;}
.lp-h .bk.drop-in{background:rgba(47,140,245,.14);color:var(--sel);}
.nb{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 9px;border-radius:17px;background:var(--soft);font-size:14px;font-weight:500;flex-shrink:0;}
.nb:hover{background:var(--hover);}
.nb svg{width:20px;height:20px;}
.nb .f{color:#f5a623;}
.lhint{font-size:12.5px;color:var(--muted);padding:8px 2px 2px;line-height:1.45;}
.lp-b{padding:6px 0 calc(60px + env(safe-area-inset-bottom,0px));}
.lr{display:flex;align-items:center;gap:4px;border-radius:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.lr:hover{background:var(--hover);}
.lr > a,.lr > button.go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 8px;text-align:left;color:inherit;text-decoration:none;-webkit-user-drag:none;}
.lr .ic{width:22px;height:22px;flex-shrink:0;color:var(--muted);}
.lr .ic.f{color:#f5a623;}
.lr .nm{flex:1;min-width:0;}
.lr .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lr .nm small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lr .cnt{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
.lr .chev{width:16px;height:16px;color:var(--muted);flex-shrink:0;}
.lr .more{width:36px;height:36px;border-radius:9px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.lr .more:hover{background:var(--soft);}
.lr.dragging{opacity:.3;}
.lr.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;background:var(--card);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.25),0 0 0 .5px var(--line);opacity:.96;}
.lr.drop-in{background:rgba(47,140,245,.14);box-shadow:inset 0 0 0 2px var(--sel);}
.lr.drop-before{box-shadow:0 -2.5px 0 0 var(--sel);border-radius:0;}
.lr.drop-after{box-shadow:0 2.5px 0 0 var(--sel);border-radius:0;}
body.ldrag{-webkit-user-select:none;user-select:none;cursor:grabbing;}
.lr.editing{background:var(--soft);padding:8px;gap:8px;margin:4px 0;flex-wrap:wrap;}
.lr.editing:hover{background:var(--soft);}
.lr.editing .ic{margin-left:4px;}
.lfs{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
.lin{width:100%;height:40px;border:1px solid var(--field);border-radius:9px;padding:0 10px;font-size:16px;background:var(--bg);outline:none;min-width:0;}
.lin:focus{border-color:var(--fg);}
.lbtns{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding-left:38px;}
.lbtn{height:34px;padding:0 13px;border-radius:9px;background:var(--card);font-size:14px;}
.lbtn.pri{background:var(--fg);color:var(--bg);font-weight:600;}
.lbtn.danger{color:var(--no);}
.lbtn.sure{background:var(--no);color:#fff;}
.lempty{color:var(--muted);text-align:center;padding:40px 16px;line-height:1.6;font-size:14.5px;}
/* estado del guardado en GitHub */
.ib.sync svg{width:21px;height:21px;}
.ib.sync.s-ok{color:var(--muted);}
.ib.sync.s-pending{color:var(--muted);opacity:.6;}
.ib.sync.s-sync{color:var(--sel);animation:pulse 1s ease-in-out infinite;}
.ib.sync.s-off{color:#d9a400;}
.ib.sync.s-err{color:var(--no);}
.ib.sync .slash{display:none;}
.ib.sync.s-none{color:var(--muted);opacity:.7;}
.ib.sync.s-none .slash{display:inline;}
@keyframes pulse{50%{opacity:.35;}}
@media (prefers-reduced-motion:reduce){.ib.sync.s-sync{animation:none;}}
.ghp{font-size:14px;color:var(--muted);line-height:1.5;}
.ghp.err{color:var(--no);}
.ghl{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:8px 0 -2px 2px;}
/* ficha en modo lectura */
.rcv{position:relative;width:200px;height:200px;max-width:70%;margin:4px auto 18px;border-radius:5px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);}
.rcv img{width:100%;height:100%;object-fit:cover;display:block;}
.rcv.v-o{box-shadow:0 0 0 3px var(--yes),var(--shadow);}
.rcv.v-x{box-shadow:0 0 0 3px var(--no),var(--shadow);}
.rhead{display:flex;align-items:center;gap:8px;}
.cp{display:block;width:100%;text-align:left;padding:6px 8px;margin:0 -8px;border-radius:9px;font-size:16px;line-height:1.3;transition:background .15s;-webkit-user-select:none;user-select:none;}
.cp:hover{background:var(--soft);}
.cp.copied{background:rgba(47,140,245,.18);}
.cp.big{flex:1;min-width:0;font-size:21px;font-weight:700;}
.cp.art{font-size:16.5px;color:var(--muted);margin-top:-2px;}
.rv{width:24px;height:24px;flex-shrink:0;}
.rv svg{width:24px;height:24px;}
.rv.o{color:var(--yes);}
.rv.x{color:var(--no);}
.rp{font-size:12.5px;color:var(--muted);white-space:nowrap;}
.rlist{margin-top:14px;}
.rr{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding:4px 0;}
.rl{width:96px;flex-shrink:0;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}
.rr .cp{flex:1;min-width:0;margin:0;}
.rchips{flex:1;display:flex;flex-wrap:wrap;gap:6px;padding:6px 0;}
.rchips .cp.chip{display:inline-block;flex:none;width:auto;margin:0;padding:5px 12px;border-radius:15px;background:var(--soft);font-size:14px;}
.rchips .cp.chip.copied{background:rgba(47,140,245,.25);}
.rhint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px;}
/* notas */
.nrow .go{gap:10px !important;}
.tw{width:16px;height:16px;flex-shrink:0;color:var(--muted);transition:transform .15s;}
.tw svg{width:16px;height:16px;}
.tw.open{transform:rotate(90deg);}
.nempty{font-size:13px;color:var(--muted);padding:6px 0 8px;}
.nedit{padding-top:4px;}
.ne-bar{display:flex;align-items:center;gap:6px;padding:2px 0 10px;}
.ne-st{flex:1;font-size:12.5px;color:var(--muted);}
.nbtn{height:34px;min-width:38px;padding:0 12px;border-radius:9px;background:var(--soft);font-size:14px;}
.nbtn b{font-weight:800;}
.nbtn.on{background:var(--fg);color:var(--bg);}
.nbtn.danger{color:var(--no);}
.nbtn.sure{background:var(--no);color:#fff;}
.ne-title{width:100%;border:0;outline:none;background:none;font-size:24px;font-weight:700;padding:4px 2px 12px;color:var(--fg);}
.ne-title::placeholder{color:var(--muted);}
.ne-card{background:var(--bg);border:1px solid var(--field);border-radius:12px;margin-bottom:calc(60px + env(safe-area-inset-bottom,0px));}
.ne-text{min-height:55vh;outline:none;padding:18px 20px;font-size:16px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word;-webkit-user-select:text;user-select:text;}
.ne-text:empty:before{content:attr(data-ph);color:var(--muted);}
.ne-text b,.ne-text strong{font-weight:700;}
/* perfiles: un botón con la foto; al tocarlo se despliegan */
.pfb{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:8px;}
.pfb .av{width:30px;height:30px;font-size:14px;box-shadow:0 0 0 1px var(--line);}
.pmenu{left:max(18px,env(safe-area-inset-left,0px));right:auto;min-width:220px;}
.pmi{display:flex !important;align-items:center;gap:10px;}
.pmi .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pmi i{font-style:normal;color:var(--fg);}
.pmi .av{width:26px;height:26px;}
.pmi.on{font-weight:600;}
.pmi{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
.phint{font-size:12px;color:var(--muted);padding:6px 12px 4px;border-top:1px solid var(--line);margin-top:4px;}
.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;font-size:12px;font-weight:700;color:#1c1c1e;}
.av.big{width:110px;height:110px;font-size:46px;opacity:1;}
.pfw{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px;}
.pfa{cursor:pointer;border-radius:50%;box-shadow:var(--shadow);display:block;line-height:0;}
.pfw .in{text-align:center;max-width:320px;}
.pfw .hint{margin:0;max-width:340px;}
.link{color:var(--sel);font-size:inherit;padding:0;}
.crw{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0;}
.crs{position:relative;width:260px;height:260px;max-width:100%;overflow:hidden;border-radius:12px;background:#000;touch-action:none;cursor:grab;}
.crs img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none;-webkit-user-drag:none;}
.crm{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:50%;box-shadow:0 0 0 400px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(255,255,255,.8);pointer-events:none;}
.crz{display:flex;align-items:center;gap:10px;width:260px;max-width:100%;color:var(--muted);font-size:18px;}
.crz input{flex:1;}
/* filtro de subgénero */
.sgbar{display:flex;align-items:center;gap:6px;padding:0 0 14px;}
.sgbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:16px;background:var(--soft);font-size:14px;color:var(--muted);max-width:70vw;}
.sgbtn svg{width:16px;height:16px;flex-shrink:0;}
.sgbtn .car{font-size:10px;opacity:.7;}
.sgbtn.on{background:var(--fg);color:var(--bg);}
.sgx{width:32px;height:32px;border-radius:16px;background:var(--soft);color:var(--muted);font-size:17px;}
.sgmenu{width:260px;max-width:calc(100vw - 24px);padding:8px;}
.sgq{width:100%;height:38px;border:1px solid var(--field);border-radius:10px;padding:0 10px;font-size:16px;background:var(--bg);outline:none;margin-bottom:6px;}
.sgq:focus{border-color:var(--fg);}
.sgl{max-height:min(46vh,340px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sgi{display:flex !important;align-items:center;gap:8px;}
.sgi .c{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.sgi.on{font-weight:600;}
.sge{font-size:13.5px;color:var(--muted);padding:10px 12px;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:#1c1c1e;color:#fff;
  padding:8px 16px;border-radius:18px;font-size:14px;opacity:0;pointer-events:none;transition:.18s;z-index:60;max-width:80vw;}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <button class="pfb" id="b-prof" aria-label="Perfil" aria-haspopup="true"></button>

      <button class="ib" id="b-notes" aria-label="Notas" title="Notas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg></button>
      <button class="ib" id="b-lists" aria-label="Listas para descubrir" title="Listas para descubrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
      <button class="ib" id="b-find" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="ib" id="b-add" aria-label="Añadir disco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="b-menu" aria-label="Más"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
    <div class="search" id="search" hidden><input id="q" type="search" placeholder="Disco, artista, género, país o año" autocomplete="off" spellcheck="false"></div>

  </div>
</header>
<div class="wrap"><main id="main"></main><div id="lists" hidden></div><div id="notes" hidden></div></div>

<div class="zb" id="zb" aria-label="Tamaño de las portadas">
  <button id="z-out" aria-label="Portadas más pequeñas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
  <button id="z-in" aria-label="Portadas más grandes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
</div>

<div class="menu" id="menu" hidden>
  <button class="mi" data-m="sync">Guardar en GitHub…</button>
  <div class="sep"></div>
  <button class="mi" data-m="export">Descargar data.json</button>
  <button class="mi" data-m="copy">Copiar datos</button>
  <label class="mi" for="f-imp">Importar data.json<input type="file" id="f-imp" accept=".json,application/json" hidden></label>
</div>
<div id="sheet"></div>
<div id="gh"></div>
<div id="pf"></div>
<div class="menu pmenu" id="pmenu" hidden></div>
<div class="menu sgmenu" id="sgmenu" hidden></div>
<div class="toast" id="toast"></div>
<datalist id="dl-art"></datalist>
<datalist id="dl-country"></datalist>
<datalist id="dl-gmain"></datalist>

<script>
(function(){
"use strict";
const $ = (s, el)=> (el || document).querySelector(s);
const $$ = (s, el)=> [...(el || document).querySelectorAll(s)];
const esc = s=> String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s=> (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = ()=> new Date().toISOString().slice(0, 10);
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('show'), 1600); }
const G_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/></svg>';
const G_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/></svg>';
const BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';

const PAL = ['#cfdfff','#d0f0fd','#c2f5e9','#d1f7c4','#ffeab6','#fee2d5','#ffdce5','#ffdaf6','#ede2fe','#e6e1d8'];
function tint(s){ let h = 0; for(const ch of norm(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return PAL[Math.abs(h) % PAL.length]; }
const face = d=> d.cover ? `<img src="${esc(coverSrc(d))}" alt="">` : `<div class="ph" style="background:${tint(d.title + d.artist)}"><b>${esc(d.title || 'Sin título')}</b><small>${esc(d.artist)}</small></div>`;
const vcls = d=> d.v === 'o' ? 'v-o' : d.v === 'x' ? 'v-x' : 'v-p';

/* ---------- datos ---------- */
/* ---------- perfiles: espacios estancos (cada uno con sus discos, listas y notas) ---------- */
var prof = '1';
try{ prof = localStorage.getItem('discos_prof') || '1'; }catch(e){}
const defProfiles = ()=> ({ updated: 0, list: [{ id: '1', name: 'Perfil 1', photo: null }, { id: '2', name: 'Perfil 2', photo: null }] });
function loadProfiles(){ try{ const o = JSON.parse(localStorage.getItem('discos_profiles')); if(o && Array.isArray(o.list) && o.list.length) return o; }catch(e){} return defProfiles(); }
var profiles = loadProfiles();
function saveProfiles(touch){ if(touch) profiles.updated = Date.now(); try{ localStorage.setItem('discos_profiles', JSON.stringify(profiles)); }catch(e){ toast('No se pudo guardar el perfil'); } if(touch) scheduleSync(); }
const dataKey = (p)=> (p || prof) === '1' ? 'discos_v3' : 'discos_v3_p' + (p || prof);
const baseKey = (p)=> (p || prof) === '1' ? 'discos_gh_base' : 'discos_gh_base_p' + (p || prof);
const dataFile = ()=> prof === '1' ? 'data.json' : 'data-' + prof + '.json';
let data, saveT;
function seed(){ return { version: 3, front: {}, discos: [], lists: [], notes: [] }; }
/* géneros: el primero es el principal (agrupa); los demás, subgéneros (se buscan y se ven en la ficha) */
function cleanG(g){ const a = Array.isArray(g) ? g.map(x=> String(x == null ? '' : x).trim()) : []; return a.some(Boolean) ? [a[0], ...a.slice(1).filter(Boolean)] : []; }
function cleanD(d){
  const g = d.genres || d.tags;
  return { id: String(d.id || uid()), title: String(d.title || ''), artist: String(d.artist || ''), year: d.year ? +d.year || '' : '',
    genres: cleanG(g), country: String(d.country || ''), v: d.v === 'o' || d.v === 'x' ? d.v : '',
    date: String(d.date || ''), cover: d.cover || null, added: d.added || Date.now(), ex: !!d.ex };
}
const valid = o=> o && Array.isArray(o.discos);
const cleanL = x=> ({ id: String(x.id || uid()), type: x.type === 'f' ? 'f' : 'l', name: String(x.name || ''), url: String(x.url || ''), parent: String(x.parent || ''), order: Number.isFinite(+x.order) && x.order !== '' && x.order != null ? +x.order : undefined });
const cleanN = x=> ({ id: String(x.id || uid()), type: x.type === 'f' ? 'f' : 'n', name: String(x.name || ''), content: String(x.content || ''), parent: String(x.parent || ''), order: Number.isFinite(+x.order) && x.order !== '' && x.order != null ? +x.order : undefined });
const cleanAll = o=> ({ version: 3, front: o.front || {}, discos: o.discos.filter(d=> d && !d.ex).map(cleanD),
  lists: Array.isArray(o.lists) ? o.lists.filter(x=> x && (x.name || x.url)).map(cleanL) : [],
  notes: Array.isArray(o.notes) ? o.notes.filter(x=> x && x.id).map(cleanN) : [] });
function load(){ try{ const o = JSON.parse(localStorage.getItem(dataKey())); if(valid(o)) return cleanAll(o); }catch(e){} return cleanAll(seed()); }
function save(){ try{ localStorage.setItem(dataKey(), JSON.stringify(data)); }catch(e){ toast('No se pudo guardar: puede que no quepan más portadas'); } scheduleSync(); }
data = load();
const byId = id=> data.discos.find(d=> d.id === id);

/* ---------- estado ---------- */
let ui = { by: 'artista', path: null, q: '', t: 150 };
try{ const s = JSON.parse(localStorage.getItem('discos_v3_ui') || '{}'); if(s.by) ui.by = s.by; if(s.t) ui.t = s.t; }catch(e){}
function saveUi(){ try{ localStorage.setItem('discos_v3_ui', JSON.stringify({ by: ui.by, t: ui.t })); }catch(e){} }

/* ---------- agrupar ---------- */
const decade = y=> y ? Math.floor(y / 10) * 10 : 0;
const keysOf = (d, by)=> by === 'artista' ? [norm(d.artist) || '~'] : by === 'genero' ? [norm(d.genres[0]) || '~'] : by === 'pais' ? [norm(d.country) || '~'] : [String(decade(d.year))];
function nameOf(k, by, ds){
  if(by === 'artista') return k === '~' ? 'Sin artista' : ds[0].artist;
  if(by === 'genero'){ if(k === '~') return 'Sin género'; const d = ds.find(x=> norm(x.genres[0]) === k); return d ? d.genres[0] : k; }
  if(by === 'pais'){ if(k === '~') return 'Sin país'; const d = ds.find(x=> norm(x.country) === k); return d ? d.country : k; }
  return k === '0' ? 'Sin año' : k + 's';
}
const byYear = (a, b)=> (a.year || 9999) - (b.year || 9999) || a.added - b.added;
/* la portada de delante: la que elijas; si no, la primera que te gustó; si no, la primera */
function frontOf(key, ds){ return ds.find(d=> d.id === data.front[key]) || ds.slice().sort(byYear).find(d=> d.v === 'o') || ds.slice().sort(byYear)[0]; }
function groups(ds, by){
  const m = new Map();
  ds.forEach(d=> keysOf(d, by).forEach(k=>{ if(!m.has(k)) m.set(k, []); m.get(k).push(d); }));
  const gs = [...m.entries()].map(([k, xs])=>({ k, by, ds: xs, name: nameOf(k, by, xs) }));
  if(by === 'ano') gs.sort((a, b)=> (a.k === '0') - (b.k === '0') || a.k - b.k);
  else gs.sort((a, b)=> (a.k === '~') - (b.k === '~') || a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
  return gs;
}

/* ---------- pintar ---------- */
function discHTML(d, sub){
  return `<button class="it ${vcls(d)}" data-open="${d.id}"><div class="st"><div class="cv">${face(d)}</div></div>
    <div class="lb"><b>${esc(d.title || 'Sin título')}</b><small>${esc(sub)}</small></div></button>`;
}
/* las de detrás: hasta 3, escalonadas hacia abajo a la derecha, con sus portadas asomando */
function layers(rest, n){
  const L = Math.min(n - 1, 3), T = Math.min(11, 5.5 * L), out = [];
  for(let i = L; i >= 1; i--){
    const o = T * i / L, d = rest[i - 1], src = d && d.cover ? coverSrc(d) : '';
    out.push(`<div class="lay" style="top:${o}%;left:${o}%;right:${T - o}%;bottom:${T - o}%;z-index:${3 - i};${src ? `background-image:url('${esc(src)}')` : d ? `background-color:${tint(d.title + d.artist)}` : ''}"></div>`);
  }
  return out.join('');
}
function pileHTML(g, path){
  const f = frontOf(g.by === 'artista' ? 'a:' + g.k : g.by + ':' + g.k, g.ds), n = g.ds.length;
  return `<button class="it pile" data-enter="${esc(path)}"><div class="st">
      ${layers(g.ds.filter(d=> d !== f), n)}<div class="cv" style="right:${Math.min(11, 5.5 * Math.min(n - 1, 3))}%;bottom:${Math.min(11, 5.5 * Math.min(n - 1, 3))}%">${face(f)}</div></div>
    <div class="lb"><b>${esc(g.name)}</b><small>${n} discos</small></div></button>`;
}
/* un grupo de 1 se ve como su disco; de varios, como pila */
function cell(g, path, subFn){ return g.ds.length === 1 ? discHTML(g.ds[0], subFn(g.ds[0])) : pileHTML(g, path); }
let lastPath = null;
function render(){
  $$('#seg button').forEach(b=> b.classList.toggle('on', b.dataset.by === ui.by));
  $('#dl-art').innerHTML = [...new Set(data.discos.map(d=> d.artist).filter(Boolean))].map(a=> `<option value="${esc(a)}">`).join('');
  $('#dl-gmain').innerHTML = allMains().map(x=> `<option value="${esc(x.g)}">`).join('');
  $('#dl-country').innerHTML = [...new Set(data.discos.map(d=> d.country).filter(Boolean))].map(a=> `<option value="${esc(a)}">`).join('');
  if(listsOpen || notesOpen) return;
  const crumb = $('#crumb'), main = $('#main');
  let html = '', title = 'Discos', count = data.discos.length, back = '', tools = '';
  const sub = d=> [d.artist, d.year].filter(Boolean).join(' · ');
  /* arriba del todo, cada disco suelto dice a qué grupo pertenece en la vista elegida */
  const subTop = d=> [d.artist, ui.by === 'genero' ? d.genres[0] : ui.by === 'pais' ? d.country : d.year].filter(Boolean).join(' · ');
  const subNoArtist = d=> String(d.year || '');

  if(ui.q){
    const q = norm(ui.q), ds = data.discos.filter(d=> [d.title, d.artist, d.country, String(d.year), ...d.genres].some(x=> norm(x).includes(q))).sort(byYear);
    html = ds.map(d=> discHTML(d, sub(d))).join(''); count = ds.length; title = 'Resultados';
  } else if(ui.by === 'todos'){
    /* todas las portadas sueltas, sin pilas; lo último que apuntaste, primero */
    ui.path = null;
    html = data.discos.slice().sort((a, b)=> b.added - a.added).map(d=> discHTML(d, sub(d))).join('');
  } else if(!ui.path){
    html = groups(data.discos, ui.by).map(g=> cell(g, g.k, subTop)).join('');
  } else {
    const [k1, k2] = ui.path.split('|');
    const g1 = groups(data.discos, ui.by).find(g=> g.k === k1);
    if(!g1){ ui.path = null; return render(); }
    if(ui.by === 'artista'){
      html = g1.ds.slice().sort(byYear).map(d=> discHTML(d, subNoArtist(d))).join(''); title = g1.name; count = g1.ds.length;
      back = 'Artistas';
    } else if(!k2){
      const ds1 = subFilter(g1, k1);
      html = groups(ds1, 'artista').map(g=> cell(g, k1 + '|' + g.k, sub)).join(''); title = g1.name; count = ds1.length;
      back = { genero: 'Géneros', pais: 'Países', ano: 'Años' }[ui.by];
      tools = subTools(g1);
    } else {
      const g2 = groups(subFilter(g1, k1), 'artista').find(g=> g.k === k2);
      if(!g2){ ui.path = k1; return render(); }
      html = g2.ds.slice().sort(byYear).map(d=> discHTML(d, subNoArtist(d))).join(''); title = g2.name; count = g2.ds.length;
      back = g1.name;
    }
  }
  crumb.innerHTML = (back ? `<button class="back" data-up aria-label="Volver a ${esc(back)}">${BACK}<span class="bl">${esc(back)}</span></button><span class="here sl" style="color:var(--muted);margin:0 2px">/</span>` : '') +
    `<span class="here">${esc(title)}</span><span class="n">${count}</span>`;
  $('#sub').hidden = !!ui.path || !!ui.q;
  main.innerHTML = tools + (html ? `<div class="grid${lastPath !== ui.path ? ' enter' : ''}" id="grid">${html}</div>`
    : `<p class="empty">${ui.q || ui.sub ? 'Nada coincide.' : 'Aún no hay discos.<br>Pulsa + o pega una portada para apuntar el primero.'}</p>`);
  lastPath = ui.path;
  applySize();
}
/* ---------- subgéneros: filtro discreto dentro de un género ---------- */
function subFilter(g1, k1){
  if(ui.by !== 'genero' || ui.subFor !== k1) ui.sub = '';
  if(!ui.sub) return g1.ds;
  return g1.ds.filter(d=> d.genres.slice(1).some(x=> norm(x) === ui.sub));
}
function subTools(g1){
  if(ui.by !== 'genero') return '';
  const list = countMap(g1.ds.flatMap(d=> d.genres.slice(1)));
  if(!list.length) return '';
  const cur = ui.sub && list.find(x=> norm(x.g) === ui.sub);
  return `<div class="sgbar"><button class="sgbtn${cur ? ' on' : ''}" id="sg-btn" aria-haspopup="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>${cur ? esc(cur.g) : 'Subgénero'}<span class="car">▾</span></button>
    ${cur ? `<button class="sgx" data-sgclear aria-label="Quitar filtro">×</button>` : ''}</div>`;
}
function openSubMenu(){
  const k1 = (ui.path || '').split('|')[0], g1 = groups(data.discos, 'genero').find(g=> g.k === k1); if(!g1) return;
  const list = countMap(g1.ds.flatMap(d=> d.genres.slice(1))), m = $('#sgmenu'), b = $('#sg-btn').getBoundingClientRect();
  m.innerHTML = `<input class="sgq" id="sg-q" type="search" placeholder="Buscar subgénero" autocomplete="off" spellcheck="false">
    <div class="sgl" id="sg-l"></div>`;
  const draw = q=>{ q = norm(q);
    const xs = list.filter(x=> !q || norm(x.g).includes(q));
    $('#sg-l').innerHTML = (!q ? `<button class="mi sgi${!ui.sub ? ' on' : ''}" data-sg="">Todos<span class="c">${g1.ds.length}</span></button>` : '') +
      (xs.map(x=> `<button class="mi sgi${ui.sub === norm(x.g) ? ' on' : ''}" data-sg="${esc(norm(x.g))}">${esc(x.g)}<span class="c">${x.n}</span></button>`).join('') || '<p class="sge">Ninguno coincide</p>'); };
  draw('');
  m.style.top = (b.bottom + 6) + 'px'; m.style.left = Math.max(12, Math.min(b.left, innerWidth - 272)) + 'px';
  m.hidden = false;
  $('#sg-q').addEventListener('input', e=> draw(e.target.value));
  if(matchMedia('(hover:hover)').matches) $('#sg-q').focus();
}
$('#sgmenu').addEventListener('click', e=>{
  const t = e.target.closest('[data-sg]'); if(!t) return;
  ui.sub = t.dataset.sg; ui.subFor = (ui.path || '').split('|')[0]; $('#sgmenu').hidden = true; lastPath = '_'; render();
});
$('#main').addEventListener('click', e=>{
  if(e.target.closest('#sg-btn')){ e.stopPropagation(); $('#sgmenu').hidden ? openSubMenu() : ($('#sgmenu').hidden = true); }
  else if(e.target.closest('[data-sgclear]')){ ui.sub = ''; lastPath = '_'; render(); }
});
document.addEventListener('click', e=>{ if(!$('#sgmenu').hidden && !e.target.closest('#sgmenu,#sg-btn')) $('#sgmenu').hidden = true; });
addEventListener('scroll', ()=>{ if(!$('#sgmenu').hidden) $('#sgmenu').hidden = true; }, { passive: true });
function applySize(){ const g = $('#grid'); if(!g) return; g.style.setProperty('--t', ui.t + 'px'); g.classList.toggle('tiny', ui.t < 92); }

/* ---------- navegar ---------- */
document.addEventListener('click', e=>{
  if(!$('#menu').hidden && !e.target.closest('#menu,#b-menu')) $('#menu').hidden = true;
  const t = e.target.closest('[data-open],[data-enter],[data-by],[data-up],[data-m]');
  if(!t || t.closest('#sheet')) return;
  if(t.dataset.open) openSheet(t.dataset.open);
  else if(t.dataset.enter != null){ ui.path = t.dataset.enter; render(); scrollTo(0, 0); }
  else if(t.dataset.by){ ui.by = t.dataset.by; ui.path = null; saveUi(); lastPath = '_'; render(); }
  else if(t.hasAttribute('data-up')){ ui.path = ui.path && ui.path.includes('|') ? ui.path.split('|')[0] : null; render(); }
  else if(t.dataset.m) menu(t.dataset.m);
});
$('#b-find').addEventListener('click', ()=>{ if(listsOpen) closeLists(); if(notesOpen) closeNotes(); const s = $('#search'); s.hidden = !s.hidden; $('#b-find').classList.toggle('on', !s.hidden); if(!s.hidden) $('#q').focus(); else { ui.q = ''; $('#q').value = ''; render(); } });
$('#q').addEventListener('input', e=>{ ui.q = e.target.value.trim(); render(); });
$('#b-menu').addEventListener('click', ()=>{ $('#menu').hidden = !$('#menu').hidden; });

/* ---------- tamaño: pellizcar, Ctrl+rueda o − + ---------- */
const clampT = t=> Math.max(64, Math.min(420, Math.round(t)));
function setSize(t){ ui.t = clampT(t); applySize(); saveUi(); }
$('#z-in').addEventListener('click', ()=> setSize(ui.t * 1.25));
$('#z-out').addEventListener('click', ()=> setSize(ui.t / 1.25));
addEventListener('wheel', e=>{ if(!(e.ctrlKey || e.metaKey) || sheetOpen) return; e.preventDefault(); setSize(ui.t * Math.exp(-e.deltaY * .01)); }, { passive: false });
/* pellizcar con dos dedos en cualquier sitio: cambia el tamaño de las portadas, nunca el de la página */
let pinch = null;
const canPinch = ()=> !sheetOpen && !listsOpen && !notesOpen && !$('#gh').innerHTML;
const tdist = t=> Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
function sizeAround(t, y){
  const h0 = document.documentElement.scrollHeight, frac = (scrollY + y) / Math.max(1, h0);
  ui.t = clampT(t); applySize();
  scrollTo(0, frac * document.documentElement.scrollHeight - y);
}
document.addEventListener('touchstart', e=>{
  if(e.touches.length === 2){ e.preventDefault(); pinch = canPinch() ? { d: tdist(e.touches), t: ui.t } : null; }
}, { passive: false });
document.addEventListener('touchmove', e=>{
  if(e.touches.length < 2) return;
  e.preventDefault();
  if(pinch) sizeAround(pinch.t * tdist(e.touches) / pinch.d, (e.touches[0].clientY + e.touches[1].clientY) / 2);
}, { passive: false });
document.addEventListener('touchend', e=>{ if(pinch && e.touches.length < 2){ pinch = null; saveUi(); } });
document.addEventListener('touchcancel', ()=>{ if(pinch){ pinch = null; saveUi(); } });
['gesturestart', 'gesturechange', 'gestureend'].forEach(n=> document.addEventListener(n, e=> e.preventDefault(), { passive: false }));

/* ---------- portadas ---------- */
function shrink(file){
  return new Promise((res, rej)=>{
    if(!file || !/^image\//.test(file.type)) return rej();
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const s = 400, c = document.createElement('canvas'), m = Math.min(img.width, img.height); c.width = c.height = s;
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .8)); };
    img.onerror = rej; img.src = url;
  });
}
document.addEventListener('paste', e=>{
  if(notesOpen || $('#pf').innerHTML) return;
  const it = [...((e.clipboardData || {}).items || [])].find(i=> i.type.startsWith('image/')); if(!it) return;
  e.preventDefault();
  shrink(it.getAsFile()).then(u=>{ if(sheetOpen){ draft.cover = u; drawSheet(); } else openNew(u); }).catch(()=> toast('No se pudo leer la imagen'));
});
document.addEventListener('dragover', e=> e.preventDefault());
document.addEventListener('drop', e=>{ e.preventDefault(); const f = e.dataTransfer.files[0]; if(!f) return;
  shrink(f).then(u=>{ if(sheetOpen){ draft.cover = u; drawSheet(); } else openNew(u); }).catch(()=>{}); });

/* ---------- ficha: nuevo o editar (se guarda al pulsar Guardar) ---------- */
let sheetOpen = false, draft = null, editId = null, sure = false;
function openNew(cover){
  const g = ui.path && !ui.q ? ui.path.split('|')[0] : '';
  const base = { title: '', artist: '', country: '', year: '', genres: [], v: '', cover: cover || null };
  if(ui.path){
    const g1 = groups(data.discos, ui.by).find(x=> x.k === g);
    if(g1 && ui.by === 'artista') base.artist = g1.name;
    if(g1 && ui.by === 'genero' && g !== '~') base.genres = [g1.name];
    if(g1 && ui.by === 'pais' && g !== '~') base.country = g1.name;
    if(g1 && ui.path.includes('|')){ const g2 = groups(g1.ds, 'artista').find(x=> x.k === ui.path.split('|')[1]); if(g2) base.artist = g2.name; }
  }
  editId = null; draft = base; show();
  setTimeout(()=> $('#s-title') && $('#s-title').focus(), 60);
}
let sheetMode = 'read';
function openSheet(id){ const d = byId(id); if(!d) return; editId = id; draft = JSON.parse(JSON.stringify(d)); sheetMode = 'read'; show(); }
function show(){ sheetOpen = true; sure = false; document.body.classList.add('lock'); drawSheet(); }
function close(){ sheetOpen = false; draft = null; editId = null; $('#sheet').innerHTML = ''; document.body.classList.remove('lock'); }
function countMap(list){ const c = new Map(); list.forEach(g=>{ const k = norm(g); if(!k) return; if(!c.has(k)) c.set(k, { g, n: 0 }); c.get(k).n++; }); return [...c.values()].sort((a, b)=> b.n - a.n); }
const allMains = ()=> countMap(data.discos.map(d=> d.genres[0]));
const allSubs = ()=> countMap(data.discos.flatMap(d=> d.genres.slice(1)));
/* ---------- ficha en modo lectura: tocar un dato lo copia; «Editar» abre el formulario ---------- */
function copyText(txt, el){
  const ok = ()=>{ toast('Copiado: ' + txt); if(el){ el.classList.add('copied'); setTimeout(()=> el.classList.remove('copied'), 500); } };
  const fallback = ()=>{
    const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, txt.length);
    let done = false; try{ done = document.execCommand('copy'); }catch(e){} ta.remove(); done ? ok() : toast('No se pudo copiar');
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
}
function drawRead(){

  const row = (lbl, val)=> val ? `<div class="rr"><span class="rl">${lbl}</span><button class="cp" data-copy="${esc(val)}">${esc(val)}</button></div>` : '';

  $('#sheet').innerHTML = `<div class="ov" data-close></div><div class="sheet" role="dialog" aria-label="Disco">
    <div class="sh-h"><button class="x" data-close>Cerrar</button><b></b><button class="ok" data-edit>Editar</button></div>
    <div class="sh-b">
      <div class="rcv ${vcls(d)}">${face(d)}</div>
      <div class="rhead">
        <button class="cp big" data-copy="${esc(d.title)}">${esc(d.title || 'Sin título')}</button>
        ${d.v ? `<span class="rv ${d.v}" title="${d.v === 'o' ? 'Me gusta' : 'No me gusta'}">${d.v === 'o' ? G_O : G_X}</span>` : '<span class="rp">por escuchar</span>'}
      </div>
      ${d.artist ? `<button class="cp art" data-copy="${esc(d.artist)}">${esc(d.artist)}</button>` : ''}
      <div class="rlist">
        ${row('País', d.country)}${row('Año', d.year ? String(d.year) : '')}${row('Género', d.genres[0])}
        ${subs.length ? `<div class="rr"><span class="rl">Subgéneros</span><span class="rchips">${subs.map(g=> `<button class="cp chip" data-copy="${esc(g)}">${esc(g)}</button>`).join('')}</span></div>` : ''}
      </div>
      <p class="rhint">Toca un dato para copiarlo</p>
    </div></div>`;
}
function drawSheet(){
  if(sheetMode === 'read' && editId) return drawRead();
  const d = draft, isNew = !editId;
  const sug = allSubs().filter(x=> !d.genres.some(g=> norm(g) === norm(x.g))).slice(0, 10);
  const pileKey = 'a:' + (norm(d.artist) || '~'), sibs = isNew ? 0 : data.discos.filter(x=> norm(x.artist) === norm(d.artist)).length;
  $('#sheet').innerHTML = `<div class="ov" data-close></div><div class="sheet" role="dialog" aria-label="${isNew ? 'Nuevo disco' : 'Disco'}">
    <div class="sh-h"><button class="x" ${isNew ? 'data-close' : 'data-back'}>Cancelar</button><b></b><button class="ok" data-save>${isNew ? 'Añadir' : 'Guardar'}</button></div>
    <div class="sh-b">
      <label class="cz${d.cover ? ' has' : ''}" id="cz">${d.cover ? `<img src="${esc(coverSrc(d))}" alt="Portada">` : 'Portada'}<input type="file" id="s-cov" accept="image/*" hidden></label>
      ${d.cover ? '' : '<p class="hint">Toca, arrastra o pega una imagen</p>'}
      <div class="fs">
        <input class="in big" id="s-title" placeholder="Disco" value="${esc(d.title)}" autocomplete="off" enterkeyhint="next">
        <input class="in" id="s-artist" placeholder="Artista" list="dl-art" value="${esc(d.artist)}" autocomplete="off" enterkeyhint="next">
        <label class="ghl" for="s-country">País</label>
        <input class="in" id="s-country" placeholder="País" list="dl-country" value="${esc(d.country || '')}" autocomplete="off" enterkeyhint="next">
        <div class="r2">
          <input class="in" id="s-year" placeholder="Año" inputmode="numeric" maxlength="4" value="${esc(d.year)}" autocomplete="off">
          <button class="vb o${d.v === 'o' ? ' on' : ''}" data-v="o" aria-label="Me gusta" aria-pressed="${d.v === 'o'}">${G_O}</button>
          <button class="vb x${d.v === 'x' ? ' on' : ''}" data-v="x" aria-label="No me gusta" aria-pressed="${d.v === 'x'}">${G_X}</button>
        </div>
        <label class="ghl" for="s-gmain">Género principal</label>
        <input class="in" id="s-gmain" placeholder="Género principal" list="dl-gmain" value="${esc(d.genres[0] || '')}" autocomplete="off" enterkeyhint="next">
        <label class="ghl" for="s-genre">Subgéneros</label>
        <div class="gbox">${d.genres.slice(1).map((g, i)=> `<span class="tg">${esc(g)}<button data-rmg="${i + 1}" aria-label="Quitar ${esc(g)}">×</button></span>`).join('')}
          <input id="s-genre" placeholder="${d.genres.length > 1 ? '' : 'Opcional: escribe y pulsa Intro'}" autocomplete="off" enterkeyhint="done"></div>
        ${sug.length ? `<div class="sugg">${sug.map(x=> `<button data-addg="${esc(x.g)}">+ ${esc(x.g)}</button>`).join('')}</div>` : ''}
      </div>
      ${isNew ? '' : `<div class="foot">
        ${sibs > 1 ? `<button class="btn" data-front>${data.front[pileKey] === editId ? 'Delante en su pila' : 'Poner delante en su pila'}</button>` : ''}
        ${d.cover ? '<button class="btn" data-nocov>Quitar portada</button>' : ''}
        <button class="btn danger${sure ? ' sure' : ''}" data-del>${sure ? 'Toca otra vez para borrar' : 'Borrar'}</button></div>`}
    </div></div>`;
  const sh = $('#sheet');
  const bind = (id, fn)=> $(id, sh).addEventListener('input', e=> fn(e.target.value));
  bind('#s-title', v=> d.title = v); bind('#s-artist', v=> d.artist = v); bind('#s-country', v=> d.country = v); bind('#s-year', v=> d.year = (v = v.replace(/\D/g, '')) ? +v : '');
  $('#s-cov', sh).addEventListener('change', e=> shrink(e.target.files[0]).then(u=>{ d.cover = u; drawSheet(); }).catch(()=>{}));
  $('#s-title', sh).addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('#s-artist').focus(); } });
  $('#s-artist', sh).addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('#s-country').focus(); } });
  $('#s-country', sh).addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('#s-year').focus(); } });
  const gi = $('#s-genre', sh);
  const addG = v=>{ v = (v || '').replace(/,/g, '').trim(); if(!v) return false; if(!d.genres.length) d.genres = ['']; if(!d.genres.slice(1).some(g=> norm(g) === norm(v))) d.genres.push(v); return true; };
  $('#s-gmain', sh).addEventListener('input', e=>{ if(!d.genres.length) d.genres = ['']; d.genres[0] = e.target.value; });
  gi.addEventListener('keydown', e=>{ if(e.key === 'Enter' || e.key === ','){ e.preventDefault(); if(addG(gi.value)){ drawSheet(); $('#s-genre').focus(); } else if(e.key === 'Enter') commit(); } });
  gi.addEventListener('blur', ()=>{ if(gi.value.trim()){ addG(gi.value); gi.value = ''; } });
}
function commit(){
  const d = draft, gi = $('#s-genre'); if(gi && gi.value.trim()){ const v = gi.value.trim(); if(!d.genres.length) d.genres = ['']; if(!d.genres.slice(1).some(g=> norm(g) === norm(v))) d.genres.push(v); }
  if(!d.title.trim() && !d.artist.trim() && !d.cover){ $('#s-title').focus(); return; }
  if(d.v && !d.date) d.date = today();
  if(editId){ Object.assign(byId(editId), cleanD({ ...d, id: editId, ex: false })); toast('Guardado'); }
  else { data.discos.push(cleanD({ ...d, id: uid(), added: Date.now() })); toast('Añadido: ' + (d.title || 'disco')); }
  save(); render();
  if(editId){ draft = JSON.parse(JSON.stringify(byId(editId))); sheetMode = 'read'; sure = false; drawSheet(); } else close();
}
$('#sheet').addEventListener('click', e=>{
  const t = e.target.closest('[data-close],[data-save],[data-v],[data-rmg],[data-addg],[data-front],[data-nocov],[data-del],[data-copy],[data-edit],[data-back]'); if(!t || !draft) return;
  if(t.dataset.copy != null){ if(t.dataset.copy) copyText(t.dataset.copy, t); return; }
  if(t.hasAttribute('data-edit')){ draft = JSON.parse(JSON.stringify(byId(editId))); sheetMode = 'edit'; sure = false; drawSheet(); return; }
  if(t.hasAttribute('data-back')){ draft = JSON.parse(JSON.stringify(byId(editId))); sheetMode = 'read'; sure = false; drawSheet(); return; }
  const d = draft;
  if(t.hasAttribute('data-close')) return close();
  if(t.hasAttribute('data-save')) return commit();
  if(t.dataset.v){ d.v = d.v === t.dataset.v ? '' : t.dataset.v; drawSheet(); }
  else if(t.dataset.rmg != null){ d.genres.splice(+t.dataset.rmg, 1); drawSheet(); }
  else if(t.dataset.addg){ if(!d.genres.length) d.genres = ['']; d.genres.push(t.dataset.addg); drawSheet(); }
  else if(t.hasAttribute('data-front')){ data.front['a:' + (norm(d.artist) || '~')] = editId; save(); drawSheet(); render(); toast('Esta portada va delante'); }
  else if(t.hasAttribute('data-nocov')){ d.cover = null; drawSheet(); }
  else if(t.hasAttribute('data-del')){ if(!sure){ sure = true; drawSheet(); return; } data.discos = data.discos.filter(x=> x.id !== editId); save(); close(); render(); toast('Disco borrado'); }
});

});

/* ---------- listas para descubrir: carpetas y enlaces ---------- */
const IC_F = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4l2 2.2h7A2.5 2.5 0 0 1 21 8.7v8.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg>';
const IC_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>';
const IC_FP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4l2 2.2h7A2.5 2.5 0 0 1 21 8.7v8.8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M12 10v6M9 13h6"/></svg>';
const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>';
const MORE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>';
let listsOpen = false, lv = { at: '', edit: null, draft: null }, lsure = false, justDragged = false;
const lById = id=> data.lists.find(x=> x.id === id);
const kidsOf = id=> data.lists.filter(x=> x.parent === id).sort((a, b)=> a.order - b.order);
const fixUrl = u=> (u = (u || '').trim()) && !/^[a-z]+:\/\//i.test(u) ? 'https://' + u : u;
const host = u=>{ try{ return new URL(fixUrl(u)).hostname.replace(/^www\./, ''); }catch(e){ return u; } };
function countIn(id){ return data.lists.filter(x=> x.parent === id).reduce((n, x)=> n + (x.type === 'f' ? countIn(x.id) : 1), 0); }
/* el orden lo decides tú al arrastrar; lo que no tenga orden se coloca: carpetas primero, por nombre */
function ensureOrders(){
  if(data.lists.every(x=> Number.isFinite(x.order))) return;
  const ps = new Set(data.lists.map(x=> x.parent));
  ps.forEach(p=>{
    data.lists.filter(x=> x.parent === p).sort((a, b)=> (Number.isFinite(a.order) ? a.order : 1e9) - (Number.isFinite(b.order) ? b.order : 1e9)
      || (a.type === 'f' ? 0 : 1) - (b.type === 'f' ? 0 : 1) || (a.name || a.url).localeCompare(b.name || b.url, 'es', { sensitivity: 'base' }))
      .forEach((x, i)=> x.order = i);
  });
}
const firstOrder = p=> Math.min(0, ...data.lists.filter(x=> x.parent === p).map(x=> x.order)) - 1;
const lastOrder = p=> Math.max(-1, ...data.lists.filter(x=> x.parent === p).map(x=> x.order)) + 1;
function isInside(id, anc){ let x = lById(id), n = 0; while(x && n++ < 999){ if(x.id === anc) return true; x = x.parent && lById(x.parent); } return false; }

function openLists(){
  if(notesOpen) closeNotes(true);
  listsOpen = true; lv = { at: '', edit: null, draft: null };
  if(!$('#search').hidden){ $('#search').hidden = true; $('#b-find').classList.remove('on'); ui.q = ''; $('#q').value = ''; }
  $('#main').hidden = true; $('#sub').hidden = true; $('#zb').hidden = true; $('#lists').hidden = false; $('#b-lists').classList.add('on'); $('#b-add').hidden = true;
  $('#crumb').innerHTML = `<button class="back" id="l-exit">${BACK}Discos</button><span class="here" style="color:var(--muted);margin:0 2px">/</span><span class="here">Listas</span>`;
  $('#l-exit').addEventListener('click', closeLists);
  drawLists(); scrollTo(0, 0); pullSoon();
}
function closeLists(silent){ listsOpen = false; $('#lists').innerHTML = ''; $('#lists').hidden = true; $('#b-lists').classList.remove('on'); if(silent === true) return; $('#main').hidden = false; $('#zb').hidden = false; $('#b-lists').classList.remove('on'); $('#b-add').hidden = false; render(); }

function rowHTML(x){
  if(x.type === 'f') return `<div class="lr" data-id="${x.id}"><button class="go" data-l="enter" data-id="${x.id}"><span class="ic f">${IC_F}</span><span class="nm"><b>${esc(x.name || 'Sin nombre')}</b></span><span class="cnt">${countIn(x.id) || ''}</span><span class="chev">${CHEV}</span></button>
    <button class="more" data-l="edit" data-id="${x.id}" aria-label="Editar carpeta">${MORE}</button></div>`;
  return `<div class="lr" data-id="${x.id}"><a href="${esc(fixUrl(x.url))}" target="_blank" rel="noopener" draggable="false"><span class="ic">${IC_L}</span><span class="nm"><b>${esc(x.name || host(x.url))}</b><small>${esc(host(x.url))}</small></span></a>
    <button class="more" data-l="edit" data-id="${x.id}" aria-label="Editar enlace">${MORE}</button></div>`;
}
function folderForm(x){
  return `<div class="lr editing" data-form="f"><span class="ic f">${IC_F}</span><div class="lfs"><input class="lin" id="e-name" value="${esc(x.name)}" placeholder="Nombre de la carpeta" autocomplete="off" enterkeyhint="done"></div>
    <div class="lbtns"><button class="lbtn pri" data-l="ok">OK</button><button class="lbtn danger${lsure ? ' sure' : ''}" data-l="del">${lsure ? 'Toca otra vez: lo de dentro sube un nivel' : 'Borrar carpeta'}</button></div></div>`;
}
function linkForm(x){
  const v = x || lv.draft;
  return `<div class="lr editing" data-form="l"><span class="ic">${IC_L}</span><div class="lfs">
      <input class="lin" id="e-name" value="${esc(v.name || '')}" placeholder="Título (lo que verás)" autocomplete="off" enterkeyhint="next">
      <input class="lin" id="e-url" value="${esc(v.url || '')}" placeholder="Pega aquí el enlace" autocomplete="off" inputmode="url" enterkeyhint="done"></div>
    <div class="lbtns"><button class="lbtn pri" data-l="ok">${x ? 'OK' : 'Añadir'}</button><button class="lbtn" data-l="cancel">Cancelar</button>
      ${x ? `<button class="lbtn danger${lsure ? ' sure' : ''}" data-l="del">${lsure ? 'Toca otra vez para borrar' : 'Borrar'}</button>` : ''}</div></div>`;
}
function drawLists(){
  ensureOrders();
  const cur = lv.at && lById(lv.at);
  if(lv.at && !cur) lv.at = '';
  const pName = cur ? (cur.parent ? (lById(cur.parent) || {}).name || 'Listas' : 'Listas') : '';
  const ks = kidsOf(lv.at);
  const head = (cur ? `<button class="bk" data-l="up" data-drop="up">${BACK}${esc(pName)}</button>` : '') +
    `<span class="tt">${cur ? esc(cur.name || 'Sin nombre') : ''}</span>
     <button class="nb" data-l="newf"><span class="f">${IC_FP}</span>Nueva carpeta</button>
     <button class="nb" data-l="newl">${IC_L}Nuevo enlace</button>`;
  let body = (lv.draft ? linkForm(null) : '') + ks.map(x=> lv.edit === x.id ? (x.type === 'f' ? folderForm(x) : linkForm(x)) : rowHTML(x)).join('');
  if(!ks.length && !lv.draft) body = `<p class="lempty">${cur ? 'Carpeta vacía.' : 'Aquí van las listas que encuentres por internet: «mejores discos de electrónica de 2010», la web de un sello…'}</p>`;
  const hint = data.lists.length > 1 && !lv.edit && !lv.draft ? `<p class="lhint">Mantén pulsado y arrastra: encima de una carpeta lo mete dentro; entre dos, lo ordena; encima de otro enlace, los junta en una carpeta nueva.${cur ? ' Sobre «‹ ' + esc(pName) + '» lo saca de aquí.' : ''}</p>` : '';
  $('#lists').innerHTML = `<div class="lp"><div class="lp-h">${head}</div>${hint}<div class="lp-b">${body}</div></div>`;
  const nm = $('#e-name'), url = $('#e-url');
  if(nm){
    const isF = $('[data-form]').dataset.form === 'f';
    setTimeout(()=>{ if(isF){ nm.focus(); nm.select(); } else (url && !url.value ? url : nm).focus(); }, 30);
    nm.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); if(url && !url.value.trim()) url.focus(); else okL(); } if(e.key === 'Escape'){ e.stopPropagation(); cancelL(); } });
    if(url) url.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); okL(); } if(e.key === 'Escape'){ e.stopPropagation(); cancelL(); } });
  }
}
function okL(){
  const nm = $('#e-name'), url = $('#e-url'), name = nm ? nm.value.trim() : '', u = url ? url.value.trim() : '';
  if(lv.draft){
    if(!u){ url.focus(); return; }
    data.lists.push(cleanL({ type: 'l', name, url: u, parent: lv.at, order: firstOrder(lv.at) })); lv.draft = null; toast('Enlace añadido');
  } else {
    const x = lById(lv.edit); if(!x) return;
    if(x.type === 'f') x.name = name || 'Carpeta nueva';
    else { if(!u){ url.focus(); return; } x.name = name; x.url = u; }
    lv.edit = null;
  }
  lsure = false; save(); drawLists();
}
function cancelL(){ lv.draft = null; lv.edit = null; lsure = false; drawLists(); }
function newFolderAt(parent, order){ const f = cleanL({ type: 'f', name: 'Carpeta nueva', parent, order }); data.lists.push(f); return f; }

/* clics */
$('#lists').addEventListener('click', e=>{
  if(justDragged){ e.preventDefault(); e.stopPropagation(); return; }
  const t = e.target.closest('[data-l]'); if(!t) return;
  const a = t.dataset.l;
  if(a === 'up'){ const c = lById(lv.at); lv.at = c ? c.parent : ''; lv.edit = null; lv.draft = null; }
  else if(a === 'enter'){ lv.at = t.dataset.id; lv.edit = null; lv.draft = null; }
  else if(a === 'newf'){ const f = newFolderAt(lv.at, firstOrder(lv.at)); save(); lv.draft = null; lv.edit = f.id; lsure = false; }
  else if(a === 'newl'){ lv.draft = { name: '', url: '' }; lv.edit = null; }
  else if(a === 'edit'){ lv.edit = t.dataset.id; lv.draft = null; lsure = false; }
  else if(a === 'ok') return okL();
  else if(a === 'cancel') return cancelL();
  else if(a === 'del'){
    if(!lsure){ lsure = true; drawLists(); return; }
    const x = lById(lv.edit);
    if(x){ kidsOf(x.id).forEach(k=>{ k.parent = x.parent; k.order = lastOrder(x.parent); }); data.lists = data.lists.filter(y=> y !== x); save(); toast('Borrado'); }
    lsure = false; lv.edit = null;
  }
  drawLists();
}, true);

/* arrastrar: con el dedo, mantener pulsado; con el ratón, arrastrar sin más */
let drag = null;
$('#lists').addEventListener('pointerdown', e=>{
  if(e.button > 0 || lv.edit || lv.draft) return;
  const row = e.target.closest('.lr:not(.editing)'); if(!row || e.target.closest('.more')) return;
  drag = { id: row.dataset.id, row, sx: e.clientX, sy: e.clientY, pid: e.pointerId, mouse: e.pointerType === 'mouse', active: false, target: null };
  if(!drag.mouse) drag.timer = setTimeout(()=> drag && startDrag(drag.sx, drag.sy), 380);
});
document.addEventListener('pointermove', e=>{
  if(!drag || e.pointerId !== drag.pid) return;
  if(!drag.active){
    const d = Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy);
    if(drag.mouse){ if(d > 6) startDrag(e.clientX, e.clientY); else return; }
    else { if(d > 10){ clearTimeout(drag.timer); drag = null; } return; }
  }
  e.preventDefault(); moveDrag(e.clientX, e.clientY);
}, { passive: false });
document.addEventListener('touchmove', e=>{ if(drag && drag.active) e.preventDefault(); }, { passive: false });
document.addEventListener('pointerup', e=>{ if(!drag || e.pointerId !== drag.pid) return; clearTimeout(drag.timer); if(drag.active) endDrag(true); drag = null; });
document.addEventListener('pointercancel', e=>{ if(!drag || e.pointerId !== drag.pid) return; clearTimeout(drag.timer); if(drag.active) endDrag(false); drag = null; });
$('#lists').addEventListener('contextmenu', e=>{ if(e.target.closest('.lr')) e.preventDefault(); });
$('#lists').addEventListener('dragstart', e=> e.preventDefault());

function startDrag(x, y){
  drag.active = true;
  if(navigator.vibrate) try{ navigator.vibrate(10); }catch(err){}
  const r = drag.row.getBoundingClientRect();
  drag.ox = drag.sx - r.left; drag.oy = drag.sy - r.top;
  const g = drag.row.cloneNode(true); g.classList.add('ghost'); g.style.width = r.width + 'px';

}
const toList = o=> Object.entries(o || {}).map(([k, v])=> ({ k, v }));
const fromList = a=> Object.fromEntries(a.map(x=> [x.k, x.v]));
const snap = o=> ({ discos: o.discos || [], lists: o.lists || [], notes: o.notes || [], front: o.front || {} });
/* nombres y fotos de los perfiles: perfiles.json. Se junta perfil a perfil: de cada uno gana su cambio más reciente */
async function syncProfiles(){
  const path = ghDir() + 'perfiles.json';
  for(let tries = 0; tries < 3; tries++){
    const r = await ghApi('/contents/' + path + '?ref=' + encodeURIComponent(gh.branch));
    let remote = null, sha;
    if(r.ok){ const j = await r.json(); sha = j.sha; try{ remote = JSON.parse(b64dec(j.content || '')); }catch(e){} }
    else if(r.status !== 404) throw new Error('perfiles ' + r.status);
    const rl = remote && Array.isArray(remote.list) ? remote.list : [];
    const ids = [...new Set([...profiles.list.map(x=> x.id), ...rl.map(x=> x.id)])];
    const merged = ids.map(id=>{
      const l = profiles.list.find(x=> x.id === id), rr = rl.find(x=> x.id === id);
      if(!l) return rr; if(!rr) return l;
      return (rr.updated || 0) > (l.updated || 0) ? rr : l;
    });
    const S = JSON.stringify;
    if(S(merged) !== S(profiles.list)){ profiles = { updated: Date.now(), list: merged }; saveProfiles(false); drawPTabs(); }
    const meaningful = merged.some(x=> x.updated);
    if(!meaningful || S(merged) === S(rl)) return;
    const p = await ghApi('/contents/' + path, { method: 'PUT', body: { message: 'Perfiles', content: b64enc(S({ updated: Date.now(), list: merged })), branch: gh.branch, ...(sha ? { sha } : {}) } });
    if(p.ok) return;
    if(p.status !== 409 && p.status !== 422) throw new Error('perfiles ' + p.status);
  }
}
async function sync(){
  if(!ghOk()) return;
  if(syncing){ syncAgain = true; return; }
  if(!navigator.onLine){ setGh('off'); return; }
  syncing = true; setGh('sync'); clearTimeout(syncT);
  const P = prof;
  try{
    await syncProfiles();
    /* 1 · portadas nuevas: cada una como imagen suelta en portadas/ */
    for(const d of data.discos){
      if(d.cover && d.cover.startsWith('data:')){
        const path = 'portadas/' + d.id + '-' + Date.now().toString(36) + '.jpg', url = d.cover;
        const r = await ghApi('/contents/' + ghDir() + path, { method: 'PUT', body: { message: 'Portada: ' + (d.title || d.id), content: url.split(',')[1], branch: gh.branch } });
        if(!r.ok) throw new Error('portada ' + r.status);
        coverCache[path] = url; d.cover = path;
      }
    }
    if(prof !== P) return;
    localStorage.setItem(dataKey(), JSON.stringify(data));
    /* 2 · traer lo último, juntar y subir si hace falta (reintenta si otro aparato guardó justo antes) */
    for(let tries = 0; tries < 3; tries++){
      const r = await ghApi('/contents/' + ghDir() + dataFile() + '?ref=' + encodeURIComponent(gh.branch));
      if(prof !== P) return;
      if(r.status === 401) throw new Error('llave');
      if(!r.ok && r.status !== 404) throw new Error('lectura ' + r.status);
      let remote = { discos: [], lists: [], front: {} }, sha;
      if(r.ok){
        const j = await r.json(); sha = j.sha;
        let txt = j.content ? b64dec(j.content) : '';
        if(!txt){ const rr = await ghApi('/contents/' + ghDir() + dataFile() + '?ref=' + encodeURIComponent(gh.branch), { raw: true }); txt = await rr.text(); }
        const o = JSON.parse(txt); if(valid(o)) remote = cleanAll(o);
      }
      const base = snap(loadBase() || {}), local = snap(data), rem = snap(remote);
      const merged = { version: 3, front: fromList(merge3(toList(base.front), toList(local.front), toList(rem.front), 'k')),
        discos: merge3(base.discos, local.discos, rem.discos, 'id'), lists: merge3(base.lists, local.lists, rem.lists, 'id'), notes: merge3(base.notes, local.notes, rem.notes, 'id') };
      const S = JSON.stringify, changedHere = S(snap(merged)) !== S(local), needPush = S(snap(merged)) !== S(rem);
      if(needPush){
        const body = { message: 'Discos: ' + new Date().toLocaleString('es-ES'), content: b64enc(JSON.stringify(merged, null, 1)), branch: gh.branch };
        if(sha) body.sha = sha;
        if(prof !== P) return;
        const p = await ghApi('/contents/' + ghDir() + dataFile(), { method: 'PUT', body });
        if(p.status === 409 || p.status === 422){ continue; }
        if(!p.ok) throw new Error('escritura ' + p.status);
      }
      if(prof !== P) return;
      data = cleanAll(merged);
      localStorage.setItem(dataKey(), JSON.stringify(data)); saveBase(snap(merged));
      lastSync = Date.now();
      if(changedHere){
        if(listsOpen){ if(!lv.edit && !lv.draft && !(typeof drag !== 'undefined' && drag)) drawLists(); }
        else if(notesOpen){ if(!nv.doc && !nv.edit && !ndrag) drawNotes(); }
        else if(!sheetOpen) render();
      }
      setGh('ok');
      return;
    }
    throw new Error('conflicto');
  }catch(e){
    const m = String(e && e.message || e);
    setGh(!navigator.onLine ? 'off' : 'err', m === 'llave' ? 'la llave no es válida o ha caducado' : m);
  }finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; scheduleSync(300); }
  }
}
addEventListener('online', ()=> scheduleSync(200));
addEventListener('offline', ()=> setGh('off'));
/* traer lo nuevo al volver a la app, y cada poco mientras está abierta */
document.addEventListener('visibilitychange', ()=>{
  if(!ghOk()) return;
  if(document.visibilityState === 'visible'){ if(Date.now() - lastSync > 5000) sync(); }
  else { /* al salir de la app: subir ya lo pendiente, sin esperar */ if(typeof flushNote === 'function') flushNote(); if(ghState === 'pending'){ clearTimeout(syncT); sync(); } }
});
addEventListener('pagehide', ()=>{ if(ghOk()){ if(typeof flushNote === 'function') flushNote(); if(ghState === 'pending'){ clearTimeout(syncT); sync(); } } });
setInterval(()=>{ if(ghOk() && document.visibilityState === 'visible' && !syncing && ghState !== 'pending' && Date.now() - lastSync > 30000) sync(); }, 10000);
function pullSoon(){ if(ghOk() && !syncing && Date.now() - lastSync > 4000) sync(); }

/* ---------- ajustes: conectar con GitHub ---------- */
function openGh(msg){
  const g = Object.assign(guessFromUrl(), gh || {});
  $('#gh').innerHTML = `<div class="ov" data-g="close"></div><div class="sheet" role="dialog" aria-label="Guardar en GitHub">
    <div class="sh-h"><button class="x" data-g="close">Cerrar</button><b>Guardar en GitHub</b><button class="ok" data-g="connect">${ghOk() ? 'Guardar' : 'Conectar'}</button></div>
    <div class="sh-b"><div class="fs">
      <p class="ghp">${ghOk() ? `Conectado. <span id="gh-state"></span>` : 'Pega tu llave de GitHub y pulsa Conectar. Lo demás ya viene puesto si abres la app desde tu web.'}</p>
      <label class="ghl" for="g-token">Llave (token)</label>
      <input class="in" id="g-token" type="password" value="${esc(g.token || '')}" placeholder="github_pat_…" autocomplete="off" spellcheck="false">
      <label class="ghl" for="g-owner">Usuario de GitHub</label>
      <input class="in" id="g-owner" value="${esc(g.owner || '')}" placeholder="tu-usuario" autocomplete="off" spellcheck="false" autocapitalize="off">
      <label class="ghl" for="g-repo">Repositorio</label>
      <input class="in" id="g-repo" value="${esc(g.repo || '')}" placeholder="nombre-del-repositorio" autocomplete="off" spellcheck="false" autocapitalize="off">
      <label class="ghl" for="g-dir">Carpeta dentro del repositorio (si está en la raíz, vacío)</label>
      <input class="in" id="g-dir" value="${esc(g.dir || '')}" placeholder="vacío" autocomplete="off" spellcheck="false" autocapitalize="off">
      ${msg ? `<p class="ghp err">${esc(msg)}</p>` : ''}
      ${ghOk() ? `<div class="foot"><button class="btn" data-g="now">Sincronizar ahora</button><button class="btn danger" data-g="off">Desconectar este aparato</button></div>` : ''}
    </div></div></div>`;
  setGh(ghState);
  document.body.classList.add('lock');
}
function closeGh(){ $('#gh').innerHTML = ''; if(!sheetOpen) document.body.classList.remove('lock'); }
$('#gh').addEventListener('click', async e=>{
  const t = e.target.closest('[data-g]'); if(!t) return;
  const a = t.dataset.g;
  if(a === 'close') return closeGh();
  if(a === 'now'){ closeGh(); sync(); return; }
  if(a === 'off'){ gh = null; localStorage.removeItem('discos_gh'); profiles.list.forEach(x=> localStorage.removeItem(baseKey(x.id))); setGh('off'); closeGh(); toast('Este aparato ya no guarda en GitHub'); return; }
  if(a === 'connect'){
    const v = id=> $(id).value.trim();
    const cand = { token: v('#g-token'), owner: v('#g-owner'), repo: v('#g-repo').replace(/\.git$/, ''), dir: v('#g-dir').replace(/^\/+|\/+$/g, '') };
    if(!cand.token || !cand.owner || !cand.repo) return openGh('Faltan la llave, el usuario o el repositorio.');
    t.textContent = 'Comprobando…'; t.disabled = true;
    try{
      const r = await fetch(`https://api.github.com/repos/${cand.owner}/${cand.repo}`, { headers: { Authorization: 'Bearer ' + cand.token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
      if(r.status === 401) return openGh('La llave no es válida. Cópiala otra vez entera (empieza por github_pat_).');
      if(r.status === 404) return openGh('No encuentro ese repositorio, o la llave no tiene acceso a él. Revisa el usuario, el nombre del repositorio y que lo elegiste al crear la llave.');
      if(!r.ok) return openGh('GitHub ha respondido con un error (' + r.status + '). Prueba otra vez en un momento.');
      const j = await r.json();
      if(j.permissions && !j.permissions.push) return openGh('La llave puede leer pero no escribir. En la llave, el permiso «Contents» tiene que estar en «Read and write».');
      const same = gh && gh.owner === cand.owner && gh.repo === cand.repo && (gh.dir || '') === cand.dir;
      gh = { ...cand, branch: j.default_branch || 'main' };
      localStorage.setItem('discos_gh', JSON.stringify(gh));
      if(!same) profiles.list.forEach(x=> localStorage.removeItem(baseKey(x.id)));
      closeGh(); toast('Conectado con GitHub'); sync();
    }catch(err){ openGh('No hay conexión con GitHub. Comprueba internet y vuelve a probar.'); }
  }
});
$('#b-sync').addEventListener('click', ()=> openGh());

/* ---------- perfiles: pestañas, cambiar y editar ---------- */
function avatar(p, cls){
  return p.photo ? `<img class="av ${cls || ''}" src="${esc(p.photo)}" alt="">`
    : `<span class="av ${cls || ''}" style="background:${tint(p.name || p.id)}">${esc((p.name || '?').trim().charAt(0).toUpperCase())}</span>`;

function drawPTabs(){

  $('#pmenu').innerHTML = profiles.list.map(p=> `<button class="mi pmi${p.id === prof ? ' on' : ''}" data-prof="${p.id}">${avatar(p)}<span class="pn">${esc(p.name || 'Perfil')}</span>${p.id === prof ? '<i>✓</i>' : ''}</button>`).join('') +
    `<p class="phint">Mantén pulsado para cambiar nombre y foto</p>`;
