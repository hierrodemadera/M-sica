<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Discos">
<title>Estantería de discos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Estantería: portadas como iconos en rejilla; lo que tiene más de un disco se ve como una pila con grosor y se abre como una carpeta.
   La interfaz es mínima (cabecera fina, un + discreto); el color solo dice el veredicto. */
:root{
  --bg:#ffffff;--fg:#1c1c1e;--muted:#8a8a8e;--line:#ececec;--soft:#f4f4f3;--field:#dcdcdc;--card:#ffffff;
  --yes:#2fb344;--no:#e5383b;--sel:#2f8cf5;--edge:#cdcdd1;--edge2:#b9b9be;
  --panel:rgba(255,255,255,.92);--panel-b:rgba(0,0,0,.08);--hover:rgba(0,0,0,.05);--ov:rgba(0,0,0,.28);
  --shadow:0 1px 1px rgba(0,0,0,.08),0 6px 16px -8px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212;--fg:#ececec;--muted:#8d8d92;--line:#262626;--soft:#1c1c1c;--field:#3a3a3a;--card:#232325;
  --yes:#3ccf7a;--no:#ff5a5f;--edge:#3a3a3d;--edge2:#2e2e31;
  --panel:rgba(44,44,46,.94);--panel-b:rgba(255,255,255,.1);--hover:rgba(255,255,255,.07);--ov:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 16px -8px rgba(0,0,0,.8);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121212;--fg:#ececec;--muted:#8d8d92;--line:#262626;--soft:#1c1c1c;--field:#3a3a3a;--card:#232325;
  --yes:#3ccf7a;--no:#ff5a5f;--edge:#3a3a3d;--edge2:#2e2e31;
  --panel:rgba(44,44,46,.94);--panel-b:rgba(255,255,255,.1);--hover:rgba(255,255,255,.07);--ov:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 16px -8px rgba(0,0,0,.8);color-scheme:dark;}

*{box-sizing:border-box;margin:0;padding:0;}
[hidden]{display:none !important;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;}
body.lock{overflow:hidden;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);}
button,input{font:inherit;color:inherit;}
button{background:none;border:none;cursor:pointer;}
svg{display:block;}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--sel);outline-offset:2px;}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));}

/* cabecera fina */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);}
.bar{display:flex;align-items:center;gap:6px;padding-block:12px 10px;}
.crumb{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:17px;font-weight:600;}
.crumb .back{display:flex;align-items:center;gap:2px;color:var(--muted);font-weight:500;font-size:16px;padding:4px 6px 4px 0;}
.crumb .back svg{width:20px;height:20px;}
.crumb .here{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.crumb .n{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums;}
.ib{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ib:hover{background:var(--soft);}
.ib.on{background:var(--fg);color:var(--bg);}
.ib svg{width:21px;height:21px;}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;}
.seg button{height:30px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--muted);}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.sub{display:flex;align-items:center;gap:10px;padding-bottom:12px;}
.search input{width:100%;height:40px;border:1px solid var(--field);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px;outline:none;margin-bottom:12px;}

/* rejilla de portadas: el tamaño lo eliges tú (pellizcar, Ctrl+rueda o − +) */
main{padding-block:10px calc(90px + env(safe-area-inset-bottom,0px));touch-action:pan-x pan-y;}
.grid{--t:150px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--t),1fr));gap:calc(var(--t) * .2) calc(var(--t) * .14);}
.grid.enter{animation:enter .22s ease-out;}
@keyframes enter{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.grid.enter{animation:none;}}
.it{display:flex;flex-direction:column;text-align:left;min-width:0;gap:8px;}
.st{position:relative;aspect-ratio:1;max-width:100%;}
.cv{position:absolute;inset:0;border-radius:4px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);z-index:3;}
.cv img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;}
.v-o .cv{box-shadow:0 0 0 2.5px var(--yes),var(--shadow);}
.v-x .cv{box-shadow:0 0 0 2.5px var(--no),var(--shadow);}
.v-p .cv{opacity:.42;}
/* el grosor de la pila: portadas de debajo asomando hacia abajo a la derecha */
.pile .cv{inset:0 6% 6% 0;}
.pile .lay{position:absolute;border-radius:4px;background:var(--edge);box-shadow:0 1px 2px rgba(0,0,0,.12);}
.pile .lay.a{inset:2% 4% 4% 2%;z-index:2;}
.pile .lay.b{inset:4% 2% 2% 4%;z-index:1;background:var(--edge2);}
.pile .lay.c{inset:6% 0 0 6%;z-index:0;background:var(--edge2);opacity:.8;}
.it:active .st{transform:scale(.97);}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:9%;color:#1c1c1e;font-size:calc(var(--t) * .085);}
.ph b{font-weight:700;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.ph small{opacity:.65;margin-top:3px;font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb{min-width:0;padding-right:6%;}
.lb b{display:block;font-size:13.5px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;}
.grid.tiny .lb{display:none;}
.empty{color:var(--muted);text-align:center;padding:60px 10px;line-height:1.6;}

/* zoom flotante */
.zb{position:fixed;z-index:15;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;
  background:var(--panel);border-radius:22px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.12),0 0 0 .5px var(--panel-b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);}
.zb button{width:40px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;}
.zb button:hover{background:var(--hover);}
.zb svg{width:20px;height:20px;}

/* ficha (nuevo o editar) */
.ov{position:fixed;inset:0;background:var(--ov);z-index:50;}
.sheet{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:min(88vh,720px);display:flex;flex-direction:column;
  background:var(--card);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease-out;}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%);}to{opacity:1;transform:translate(-50%,-50%);}}
@media (max-width:560px){ .sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:auto;max-height:92vh;border-radius:16px 16px 0 0;animation:none;} }
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);}
.sh-h b{flex:1;font-size:16px;}
.sh-h .x{color:var(--muted);font-size:15px;padding:6px 8px;}
.sh-h .ok{height:34px;padding:0 16px;border-radius:17px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;}
.sh-b{overflow-y:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));}
.cz{position:relative;display:flex;align-items:center;justify-content:center;width:150px;height:150px;margin:0 auto 14px;border-radius:5px;overflow:hidden;border:1.5px dashed var(--field);
  color:var(--muted);font-size:13px;line-height:1.4;text-align:center;cursor:pointer;}
.cz.has{border:0;box-shadow:var(--shadow);}
.cz.drag{border-color:var(--fg);}
.cz img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.fs{display:flex;flex-direction:column;gap:8px;}
.in{width:100%;height:44px;border:1px solid var(--field);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px;outline:none;}
.in:focus{border-color:var(--fg);}
.in.big{font-weight:600;font-size:17px;}
.r2{display:flex;gap:8px;}
.r2 .in{flex:1;min-width:0;}
.vb{width:52px;height:44px;border-radius:11px;border:1px solid var(--field);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
.vb svg{width:20px;height:20px;}
.vb.on.o{background:var(--yes);border-color:var(--yes);color:#fff;}
.vb.on.x{background:var(--no);border-color:var(--no);color:#fff;}
.gbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--field);border-radius:10px;padding:6px;min-height:44px;}
.gbox input{flex:1;min-width:120px;border:0;outline:none;background:none;height:30px;padding:0 6px;font-size:16px;}
.tg{display:inline-flex;align-items:center;height:30px;border-radius:15px;background:var(--soft);font-size:14px;padding-left:12px;}
.tg button{padding:0 10px 0 6px;height:100%;color:var(--muted);}
.sugg{display:flex;flex-wrap:wrap;gap:6px;}
.sugg button{height:28px;padding:0 11px;border-radius:14px;background:var(--soft);font-size:13px;color:var(--muted);}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;}
.btn{height:40px;padding:0 14px;border-radius:10px;background:var(--soft);font-size:14.5px;}
.btn.danger{color:var(--no);}
.btn.danger.sure{background:var(--no);color:#fff;}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:-6px;margin-bottom:12px;}

.menu{position:fixed;z-index:40;top:calc(56px + env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));min-width:240px;background:var(--card);border-radius:14px;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.2),0 0 0 .5px var(--line);}
.menu .mi{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:15px;cursor:pointer;}
.menu .mi:hover{background:var(--soft);}
.menu .sep{height:1px;background:var(--line);margin:5px 8px;}
.menu .danger{color:var(--no);}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:#1c1c1e;color:#fff;
  padding:8px 16px;border-radius:18px;font-size:14px;opacity:0;pointer-events:none;transition:.18s;z-index:60;max-width:80vw;}
.toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head><body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="crumb" id="crumb"></div>
      <button class="ib" id="b-find" aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="ib" id="b-add" aria-label="Añadir disco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" id="b-menu" aria-label="Más"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
    <div class="search" id="search" hidden><input id="q" type="search" placeholder="Disco, artista, género o año" autocomplete="off" spellcheck="false"></div>
    <div class="sub" id="sub"><div class="seg" id="seg"><button data-by="artista">Artistas</button><button data-by="genero">Géneros</button><button data-by="ano">Años</button></div></div>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>

<div class="zb" aria-label="Tamaño de las portadas">
  <button id="z-out" aria-label="Portadas más pequeñas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
  <button id="z-in" aria-label="Portadas más grandes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
</div>

<div class="menu" id="menu" hidden>
  <button class="mi" data-m="export">Descargar data.json</button>
  <button class="mi" data-m="copy">Copiar datos</button>
  <label class="mi" for="f-imp">Importar data.json<input type="file" id="f-imp" accept=".json,application/json" hidden></label>
</div>
<div id="sheet"></div>
<div class="toast" id="toast"></div>
<datalist id="dl-art"></datalist>

<script>
(function(){
"use strict";
const $ = (s, el)=> (el || document).querySelector(s);
const $$ = (s, el)=> [...(el || document).querySelectorAll(s)];
const esc = s=> String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s=> (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = ()=> new Date().toISOString().slice(0, 10);
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove('show'), 1600); }
const G_O = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/></svg>';
const G_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/></svg>';
const BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>';

const PAL = ['#cfdfff','#d0f0fd','#c2f5e9','#d1f7c4','#ffeab6','#fee2d5','#ffdce5','#ffdaf6','#ede2fe','#e6e1d8'];
function tint(s){ let h = 0; for(const ch of norm(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return PAL[Math.abs(h) % PAL.length]; }
const face = d=> d.cover ? `<img src="${d.cover}" alt="">` : `<div class="ph" style="background:${tint(d.title + d.artist)}"><b>${esc(d.title || 'Sin título')}</b><small>${esc(d.artist)}</small></div>`;
const vcls = d=> d.v === 'o' ? 'v-o' : d.v === 'x' ? 'v-x' : 'v-p';

/* ---------- datos ---------- */
const KEY = 'discos_v3';
let data, saveT;
function seed(){ return { version: 3, front: {}, discos: [] }; }
function cleanD(d){
  const g = d.genres || d.tags;
  return { id: String(d.id || uid()), title: String(d.title || ''), artist: String(d.artist || ''), year: d.year ? +d.year || '' : '',
    genres: Array.isArray(g) ? g.map(String).filter(Boolean) : [], v: d.v === 'o' || d.v === 'x' ? d.v : '',
    date: String(d.date || ''), cover: d.cover || null, added: d.added || Date.now(), ex: !!d.ex };
}
const valid = o=> o && Array.isArray(o.discos);
const cleanAll = o=> ({ version: 3, front: o.front || {}, discos: o.discos.filter(d=> d && !d.ex).map(cleanD) });
function load(){ try{ const o = JSON.parse(localStorage.getItem(KEY)); if(valid(o)) return cleanAll(o); }catch(e){} return cleanAll(seed()); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ toast('No se pudo guardar: puede que no quepan más portadas'); } }
data = load();
const byId = id=> data.discos.find(d=> d.id === id);

/* ---------- estado ---------- */
let ui = { by: 'artista', path: null, q: '', t: 150 };
try{ const s = JSON.parse(localStorage.getItem('discos_v3_ui') || '{}'); if(s.by) ui.by = s.by; if(s.t) ui.t = s.t; }catch(e){}
function saveUi(){ try{ localStorage.setItem('discos_v3_ui', JSON.stringify({ by: ui.by, t: ui.t })); }catch(e){} }

/* ---------- agrupar ---------- */
const decade = y=> y ? Math.floor(y / 10) * 10 : 0;
const keysOf = (d, by)=> by === 'artista' ? [norm(d.artist) || '~'] : by === 'genero' ? (d.genres.length ? d.genres.map(norm) : ['~']) : [String(decade(d.year))];
function nameOf(k, by, ds){
  if(by === 'artista') return k === '~' ? 'Sin artista' : ds[0].artist;
  if(by === 'genero'){ if(k === '~') return 'Sin género'; for(const d of ds){ const g = d.genres.find(x=> norm(x) === k); if(g) return g; } return k; }
  return k === '0' ? 'Sin año' : k + 's';
}
const byYear = (a, b)=> (a.year || 9999) - (b.year || 9999) || a.added - b.added;
/* la portada de delante: la que elijas; si no, la primera que te gustó; si no, la primera */
function frontOf(key, ds){ return ds.find(d=> d.id === data.front[key]) || ds.slice().sort(byYear).find(d=> d.v === 'o') || ds.slice().sort(byYear)[0]; }
function groups(ds, by){
  const m = new Map();
  ds.forEach(d=> keysOf(d, by).forEach(k=>{ if(!m.has(k)) m.set(k, []); m.get(k).push(d); }));
  const gs = [...m.entries()].map(([k, xs])=>({ k, by, ds: xs, name: nameOf(k, by, xs) }));
  if(by === 'ano') gs.sort((a, b)=> (a.k === '0') - (b.k === '0') || a.k - b.k);
  else gs.sort((a, b)=> (a.k === '~') - (b.k === '~') || a.name.localeCompare(b.name, 'es', { sensitivity: 'base' }));
  return gs;
}

/* ---------- pintar ---------- */
function discHTML(d, sub){
  return `<button class="it ${vcls(d)}" data-open="${d.id}"><div class="st"><div class="cv">${face(d)}</div></div>
    <div class="lb"><b>${esc(d.title || 'Sin título')}</b><small>${esc(sub)}</small></div></button>`;
}
function pileHTML(g, path){
  const f = frontOf(g.by === 'artista' ? 'a:' + g.k : g.by + ':' + g.k, g.ds), n = g.ds.length;
  return `<button class="it pile" data-enter="${esc(path)}"><div class="st">
      <div class="lay a"></div>${n > 2 ? '<div class="lay b"></div>' : ''}${n > 4 ? '<div class="lay c"></div>' : ''}<div class="cv">${face(f)}</div></div>
    <div class="lb"><b>${esc(g.name)}</b><small>${n} discos</small></div></button>`;
}
/* un grupo de 1 se ve como su disco; de varios, como pila */
function cell(g, path, subFn){ return g.ds.length === 1 ? discHTML(g.ds[0], subFn(g.ds[0])) : pileHTML(g, path); }
let lastPath = null;
function render(){
  $$('#seg button').forEach(b=> b.classList.toggle('on', b.dataset.by === ui.by));
  $('#dl-art').innerHTML = [...new Set(data.discos.map(d=> d.artist).filter(Boolean))].map(a=> `<option value="${esc(a)}">`).join('');
  const crumb = $('#crumb'), main = $('#main');
  let html = '', title = 'Discos', count = data.discos.length, back = '';
  const sub = d=> [d.artist, d.year].filter(Boolean).join(' · ');
  const subNoArtist = d=> String(d.year || '');

  if(ui.q){
    const q = norm(ui.q), ds = data.discos.filter(d=> [d.title, d.artist, String(d.year), ...d.genres].some(x=> norm(x).includes(q))).sort(byYear);
    html = ds.map(d=> discHTML(d, sub(d))).join(''); count = ds.length; title = 'Resultados';
  } else if(!ui.path){
    html = groups(data.discos, ui.by).map(g=> cell(g, g.k, sub)).join('');
  } else {
    const [k1, k2] = ui.path.split('|');
    const g1 = groups(data.discos, ui.by).find(g=> g.k === k1);
    if(!g1){ ui.path = null; return render(); }
    if(ui.by === 'artista'){
      html = g1.ds.slice().sort(byYear).map(d=> discHTML(d, subNoArtist(d))).join(''); title = g1.name; count = g1.ds.length;
      back = 'Artistas';
    } else if(!k2){
      html = groups(g1.ds, 'artista').map(g=> cell(g, k1 + '|' + g.k, sub)).join(''); title = g1.name; count = g1.ds.length;
      back = ui.by === 'genero' ? 'Géneros' : 'Años';
    } else {
      const g2 = groups(g1.ds, 'artista').find(g=> g.k === k2);
      if(!g2){ ui.path = k1; return render(); }
      html = g2.ds.slice().sort(byYear).map(d=> discHTML(d, subNoArtist(d))).join(''); title = g2.name; count = g2.ds.length;
      back = g1.name;
    }
  }
  crumb.innerHTML = (back ? `<button class="back" data-up>${BACK}${esc(back)}</button><span class="here" style="color:var(--muted);margin:0 2px">/</span>` : '') +
    `<span class="here">${esc(title)}</span><span class="n">${count}</span>`;
  $('#sub').hidden = !!ui.path || !!ui.q;
  main.innerHTML = html ? `<div class="grid${lastPath !== ui.path ? ' enter' : ''}" id="grid">${html}</div>`
    : `<p class="empty">${ui.q ? 'Nada coincide.' : 'Aún no hay discos.<br>Pulsa + o pega una portada para apuntar el primero.'}</p>`;
  lastPath = ui.path;
  applySize();
}
function applySize(){ const g = $('#grid'); if(!g) return; g.style.setProperty('--t', ui.t + 'px'); g.classList.toggle('tiny', ui.t < 92); }

/* ---------- navegar ---------- */
document.addEventListener('click', e=>{
  if(!$('#menu').hidden && !e.target.closest('#menu,#b-menu')) $('#menu').hidden = true;
  const t = e.target.closest('[data-open],[data-enter],[data-by],[data-up],[data-m]');
  if(!t || t.closest('#sheet')) return;
  if(t.dataset.open) openSheet(t.dataset.open);
  else if(t.dataset.enter != null){ ui.path = t.dataset.enter; render(); scrollTo(0, 0); }
  else if(t.dataset.by){ ui.by = t.dataset.by; ui.path = null; saveUi(); lastPath = '_'; render(); }
  else if(t.hasAttribute('data-up')){ ui.path = ui.path && ui.path.includes('|') ? ui.path.split('|')[0] : null; render(); }
  else if(t.dataset.m) menu(t.dataset.m);
});
$('#b-find').addEventListener('click', ()=>{ const s = $('#search'); s.hidden = !s.hidden; $('#b-find').classList.toggle('on', !s.hidden); if(!s.hidden) $('#q').focus(); else { ui.q = ''; $('#q').value = ''; render(); } });
$('#q').addEventListener('input', e=>{ ui.q = e.target.value.trim(); render(); });
$('#b-menu').addEventListener('click', ()=>{ $('#menu').hidden = !$('#menu').hidden; });

/* ---------- tamaño: pellizcar, Ctrl+rueda o − + ---------- */
const clampT = t=> Math.max(64, Math.min(420, Math.round(t)));
function setSize(t){ ui.t = clampT(t); applySize(); saveUi(); }
$('#z-in').addEventListener('click', ()=> setSize(ui.t * 1.25));
$('#z-out').addEventListener('click', ()=> setSize(ui.t / 1.25));
addEventListener('wheel', e=>{ if(!(e.ctrlKey || e.metaKey) || sheetOpen) return; e.preventDefault(); setSize(ui.t * Math.exp(-e.deltaY * .01)); }, { passive: false });
const tp = new Map(); let pinch = null;
const main = $('#main');
main.addEventListener('pointerdown', e=>{ if(e.pointerType !== 'touch') return; tp.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(tp.size === 2){ const [a, b] = [...tp.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), t: ui.t }; } });
main.addEventListener('pointermove', e=>{ if(!tp.has(e.pointerId)) return; tp.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(pinch && tp.size === 2){ const [a, b] = [...tp.values()]; setSize(pinch.t * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d); } });
const tpEnd = e=>{ tp.delete(e.pointerId); if(tp.size < 2) pinch = null; };
main.addEventListener('pointerup', tpEnd); main.addEventListener('pointercancel', tpEnd);
document.addEventListener('gesturestart', e=> e.preventDefault());
/* con dos dedos la página no debe hacer su propio zoom */
main.addEventListener('touchmove', e=>{ if(e.touches.length > 1) e.preventDefault(); }, { passive: false });

/* ---------- portadas ---------- */
function shrink(file){
  return new Promise((res, rej)=>{
    if(!file || !/^image\//.test(file.type)) return rej();
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{ const s = 400, c = document.createElement('canvas'), m = Math.min(img.width, img.height); c.width = c.height = s;
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, s, s); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .8)); };
    img.onerror = rej; img.src = url;
  });
}
document.addEventListener('paste', e=>{
  const it = [...((e.clipboardData || {}).items || [])].find(i=> i.type.startsWith('image/')); if(!it) return;
  e.preventDefault();
  shrink(it.getAsFile()).then(u=>{ if(sheetOpen){ draft.cover = u; drawSheet(); } else openNew(u); }).catch(()=> toast('No se pudo leer la imagen'));
});
document.addEventListener('dragover', e=> e.preventDefault());
document.addEventListener('drop', e=>{ e.preventDefault(); const f = e.dataTransfer.files[0]; if(!f) return;
  shrink(f).then(u=>{ if(sheetOpen){ draft.cover = u; drawSheet(); } else openNew(u); }).catch(()=>{}); });

/* ---------- ficha: nuevo o editar (se guarda al pulsar Guardar) ---------- */
let sheetOpen = false, draft = null, editId = null, sure = false;
function openNew(cover){
  const g = ui.path && !ui.q ? ui.path.split('|')[0] : '';
  const base = { title: '', artist: '', year: '', genres: [], v: '', cover: cover || null };
  if(ui.path){
    const g1 = groups(data.discos, ui.by).find(x=> x.k === g);
    if(g1 && ui.by === 'artista') base.artist = g1.name;
    if(g1 && ui.by === 'genero' && g !== '~') base.genres = [g1.name];
    if(g1 && ui.path.includes('|')){ const g2 = groups(g1.ds, 'artista').find(x=> x.k === ui.path.split('|')[1]); if(g2) base.artist = g2.name; }
  }
  editId = null; draft = base; show();
  setTimeout(()=> $('#s-title') && $('#s-title').focus(), 60);
}
function openSheet(id){ const d = byId(id); if(!d) return; editId = id; draft = JSON.parse(JSON.stringify(d)); show(); }
function show(){ sheetOpen = true; sure = false; document.body.classList.add('lock'); drawSheet(); }
function close(){ sheetOpen = false; draft = null; editId = null; $('#sheet').innerHTML = ''; document.body.classList.remove('lock'); }
function allGenres(){
  const c = new Map(); data.discos.forEach(d=> d.genres.forEach(g=>{ const k = norm(g); if(!c.has(k)) c.set(k, { g, n: 0 }); c.get(k).n++; }));
  return [...c.values()].sort((a, b)=> b.n - a.n);
}
function drawSheet(){
  const d = draft, isNew = !editId;
  const sug = allGenres().filter(x=> !d.genres.some(g=> norm(g) === norm(x.g))).slice(0, 10);
  const pileKey = 'a:' + (norm(d.artist) || '~'), sibs = isNew ? 0 : data.discos.filter(x=> norm(x.artist) === norm(d.artist)).length;
  $('#sheet').innerHTML = `<div class="ov" data-close></div><div class="sheet" role="dialog" aria-label="${isNew ? 'Nuevo disco' : 'Disco'}">
    <div class="sh-h"><button class="x" data-close>Cancelar</button><b></b><button class="ok" data-save>${isNew ? 'Añadir' : 'Guardar'}</button></div>
    <div class="sh-b">
      <label class="cz${d.cover ? ' has' : ''}" id="cz">${d.cover ? `<img src="${d.cover}" alt="Portada">` : 'Portada'}<input type="file" id="s-cov" accept="image/*" hidden></label>
      ${d.cover ? '' : '<p class="hint">Toca, arrastra o pega una imagen</p>'}
      <div class="fs">
        <input class="in big" id="s-title" placeholder="Disco" value="${esc(d.title)}" autocomplete="off" enterkeyhint="next">
        <input class="in" id="s-artist" placeholder="Artista" list="dl-art" value="${esc(d.artist)}" autocomplete="off" enterkeyhint="next">
        <div class="r2">
          <input class="in" id="s-year" placeholder="Año" inputmode="numeric" maxlength="4" value="${esc(d.year)}" autocomplete="off">
          <button class="vb o${d.v === 'o' ? ' on' : ''}" data-v="o" aria-label="Me gusta" aria-pressed="${d.v === 'o'}">${G_O}</button>
          <button class="vb x${d.v === 'x' ? ' on' : ''}" data-v="x" aria-label="No me gusta" aria-pressed="${d.v === 'x'}">${G_X}</button>
        </div>
        <div class="gbox">${d.genres.map((g, i)=> `<span class="tg">${esc(g)}<button data-rmg="${i}" aria-label="Quitar ${esc(g)}">×</button></span>`).join('')}
          <input id="s-genre" placeholder="${d.genres.length ? '' : 'Género'}" autocomplete="off" enterkeyhint="done"></div>
        ${sug.length ? `<div class="sugg">${sug.map(x=> `<button data-addg="${esc(x.g)}">+ ${esc(x.g)}</button>`).join('')}</div>` : ''}
      </div>
      ${isNew ? '' : `<div class="foot">
        ${sibs > 1 ? `<button class="btn" data-front>${data.front[pileKey] === editId ? 'Delante en su pila' : 'Poner delante en su pila'}</button>` : ''}
        ${d.cover ? '<button class="btn" data-nocov>Quitar portada</button>' : ''}
        <button class="btn danger${sure ? ' sure' : ''}" data-del>${sure ? 'Toca otra vez para borrar' : 'Borrar'}</button></div>`}
    </div></div>`;
  const sh = $('#sheet');
  const bind = (id, fn)=> $(id, sh).addEventListener('input', e=> fn(e.target.value));
  bind('#s-title', v=> d.title = v); bind('#s-artist', v=> d.artist = v); bind('#s-year', v=> d.year = (v = v.replace(/\D/g, '')) ? +v : '');
  $('#s-cov', sh).addEventListener('change', e=> shrink(e.target.files[0]).then(u=>{ d.cover = u; drawSheet(); }).catch(()=>{}));
  $('#s-title', sh).addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('#s-artist').focus(); } });
  $('#s-artist', sh).addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); $('#s-year').focus(); } });
  const gi = $('#s-genre', sh);
  const addG = v=>{ v = (v || '').replace(/,/g, '').trim(); if(!v) return false; if(!d.genres.some(g=> norm(g) === norm(v))) d.genres.push(v); return true; };
  gi.addEventListener('keydown', e=>{ if(e.key === 'Enter' || e.key === ','){ e.preventDefault(); if(addG(gi.value)){ drawSheet(); $('#s-genre').focus(); } else if(e.key === 'Enter') commit(); } });
  gi.addEventListener('blur', ()=>{ if(gi.value.trim()){ addG(gi.value); gi.value = ''; } });
}
function commit(){
  const d = draft, gi = $('#s-genre'); if(gi && gi.value.trim()){ const v = gi.value.trim(); if(!d.genres.some(g=> norm(g) === norm(v))) d.genres.push(v); }
  if(!d.title.trim() && !d.artist.trim() && !d.cover){ $('#s-title').focus(); return; }
  if(d.v && !d.date) d.date = today();
  if(editId){ Object.assign(byId(editId), cleanD({ ...d, id: editId, ex: false })); toast('Guardado'); }
  else { data.discos.push(cleanD({ ...d, id: uid(), added: Date.now() })); toast('Añadido: ' + (d.title || 'disco')); }
  save(); close(); render();
}
$('#sheet').addEventListener('click', e=>{
  const t = e.target.closest('[data-close],[data-save],[data-v],[data-rmg],[data-addg],[data-front],[data-nocov],[data-del]'); if(!t || !draft) return;
  const d = draft;
  if(t.hasAttribute('data-close')) return close();
  if(t.hasAttribute('data-save')) return commit();
  if(t.dataset.v){ d.v = d.v === t.dataset.v ? '' : t.dataset.v; drawSheet(); }
  else if(t.dataset.rmg != null){ d.genres.splice(+t.dataset.rmg, 1); drawSheet(); }
  else if(t.dataset.addg){ d.genres.push(t.dataset.addg); drawSheet(); }
  else if(t.hasAttribute('data-front')){ data.front['a:' + (norm(d.artist) || '~')] = editId; save(); drawSheet(); render(); toast('Esta portada va delante'); }
  else if(t.hasAttribute('data-nocov')){ d.cover = null; drawSheet(); }
  else if(t.hasAttribute('data-del')){ if(!sure){ sure = true; drawSheet(); return; } data.discos = data.discos.filter(x=> x.id !== editId); save(); close(); render(); toast('Disco borrado'); }
});
$('#b-add').addEventListener('click', ()=> openNew());
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){ if(sheetOpen) close(); else if(ui.path){ $('[data-up]') && $('[data-up]').click(); } }
  if(sheetOpen && (e.metaKey || e.ctrlKey) && e.key === 'Enter') commit();
});

/* ---------- menú ---------- */
function fileData(){ return { version: 3, exportedAt: new Date().toISOString(), front: data.front, discos: data.discos }; }
function menu(m){
  $('#menu').hidden = true;
  if(m === 'export'){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(fileData())], { type: 'application/json' })); a.download = 'data.json'; document.body.appendChild(a); a.click(); a.remove(); }
  else if(m === 'copy') navigator.clipboard.writeText(JSON.stringify(fileData())).then(()=> toast('Datos copiados'), ()=> toast('No se pudo copiar'));
}
$('#f-imp').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t=>{ const o = JSON.parse(t); if(!valid(o)) throw 0; data = cleanAll(o); ui.path = null; save(); render(); toast(data.discos.length + ' discos importados'); }).catch(()=> toast('Ese archivo no es un data.json de discos'));
  e.target.value = ''; $('#menu').hidden = true;
});

/* publicado en GitHub junto a data.json: si aquí solo hay ejemplos, se carga lo publicado */
if(/^https?:/.test(location.protocol) && !data.discos.length){
  fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(r=> r.ok ? r.json() : null).then(o=>{ if(valid(o) && o.discos.length){ data = cleanAll(o); save(); render(); } }).catch(()=>{});
}
render();
})();
</script>
</body></html>
