const sleep = ms=> new Promise(r=> setTimeout(r, ms));
async function switchProfile(id){
  if(id === prof) return;
  if(sheetOpen) close(); if(listsOpen) closeLists(true); if(notesOpen) closeNotes(true);
  if(ghOk()){ clearTimeout(syncT); while(syncing) await sleep(80); if(ghState === 'pending') await sync(); }
  prof = id; try{ localStorage.setItem('discos_prof', id); }catch(e){}
  data = load(); ui.path = null; ui.q = ''; $('#q').value = ''; $('#search').hidden = true; $('#b-find').classList.remove('on');
  $('#main').hidden = false; $('#zb').hidden = false; $('#b-add').hidden = false;
  drawPTabs(); lastPath = '_'; render(); scrollTo(0, 0);
  if(ghOk()) sync();
}
$('#b-prof').addEventListener('click', e=>{ e.stopPropagation(); $('#menu').hidden = true; $('#pmenu').hidden = !$('#pmenu').hidden; });
/* tocar = cambiar de perfil; mantener pulsado (o clic derecho) = cambiar su nombre y foto */
let pHold = null, pHeld = false;
$('#pmenu').addEventListener('pointerdown', e=>{
  const t = e.target.closest('[data-prof]'); if(!t) return; pHeld = false;
  pHold = { id: t.dataset.prof, x: e.clientX, y: e.clientY, tm: setTimeout(()=>{ pHeld = true; if(navigator.vibrate) try{ navigator.vibrate(10); }catch(er){} try{ getSelection().removeAllRanges(); }catch(er){} $('#pmenu').hidden = true; openProfile(pHold.id); }, 420) };
});
const pCancel = ()=>{ if(pHold){ clearTimeout(pHold.tm); pHold = null; } };
$('#pmenu').addEventListener('pointermove', e=>{ if(pHold && Math.hypot(e.clientX - pHold.x, e.clientY - pHold.y) > 18) pCancel(); });
$('#pmenu').addEventListener('selectstart', e=> e.preventDefault());
$('#pmenu').addEventListener('pointerup', pCancel); $('#pmenu').addEventListener('pointercancel', pCancel);
$('#pmenu').addEventListener('contextmenu', e=>{ const t = e.target.closest('[data-prof]'); if(!t) return; e.preventDefault(); pCancel(); if(!pHeld){ $('#pmenu').hidden = true; openProfile(t.dataset.prof); } });
$('#pmenu').addEventListener('click', e=>{
  const t = e.target.closest('[data-prof]'); if(!t) return;
  if(pHeld){ pHeld = false; return; }
  $('#pmenu').hidden = true;
  if(t.dataset.prof !== prof){ switchProfile(t.dataset.prof); const p = profiles.list.find(x=> x.id === t.dataset.prof); toast('Perfil: ' + (p ? p.name : '')); }
});
document.addEventListener('click', e=>{ if(!$('#pmenu').hidden && !e.target.closest('#pmenu,#b-prof')) $('#pmenu').hidden = true; });
let pfDraft = null;
function openProfile(id){ const p = profiles.list.find(x=> x.id === (id || prof)); pfDraft = { ...p }; drawProfile(); document.body.classList.add('lock'); }
function closeProfile(){ $('#pf').innerHTML = ''; pfDraft = null; if(!sheetOpen) document.body.classList.remove('lock'); }
function drawProfile(){
  const p = pfDraft;
  $('#pf').innerHTML = `<div class="ov" data-p="close"></div><div class="sheet" role="dialog" aria-label="Perfil">
    <div class="sh-h"><button class="x" data-p="close">Cancelar</button><b></b><button class="ok" data-p="save">Guardar</button></div>
    <div class="sh-b"><div class="pfw">
      <label class="pfa">${avatar(p, 'big')}<input type="file" id="p-photo" accept="image/*" hidden></label>
      <p class="hint">Toca la foto para cambiarla${p.photo ? ' · <button class="link" data-p="nophoto">quitarla</button>' : ''}</p>
      <input class="in big" id="p-name" value="${esc(p.name)}" placeholder="Nombre o apodo" autocomplete="off" enterkeyhint="done">
      <p class="hint">Cada perfil tiene sus propios discos, listas y notas. Lo que hagas aquí no toca nada del otro.</p>
    </div></div></div>`;
  $('#p-name').addEventListener('input', e=> pfDraft.name = e.target.value);
  $('#p-name').addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); saveProfile(); } });
  $('#p-photo').addEventListener('change', e=> photoFrom(e.target.files[0]));
}
/* elegir foto → ajustarla dentro del círculo (arrastrar para mover, pellizcar o deslizar para ampliar) */
const CW = 260;
let crop = null;
function photoFrom(file){
  if(!file || !/^image\//.test(file.type)) return;
  const n = $('#p-name') ? $('#p-name').value : pfDraft.name; pfDraft.name = n;
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = ()=>{ crop = { img, url, base: Math.max(CW / img.width, CW / img.height), z: 1, x: 0, y: 0 }; drawCrop(); };
  img.onerror = ()=> toast('No se pudo leer la imagen');
  img.src = url;
}
function clampCrop(){
  const w = crop.img.width * crop.base * crop.z, h = crop.img.height * crop.base * crop.z;
  const mx = Math.max(0, (w - CW) / 2), my = Math.max(0, (h - CW) / 2);
  crop.x = Math.max(-mx, Math.min(mx, crop.x)); crop.y = Math.max(-my, Math.min(my, crop.y));
}
function paintCrop(){
  clampCrop(); const im = $('#cr-img'); if(!im) return;
  im.style.width = crop.img.width * crop.base * crop.z + 'px';
  im.style.transform = `translate(-50%,-50%) translate(${crop.x}px,${crop.y}px)`;
  const r = $('#cr-z'); if(r && +r.value !== crop.z) r.value = crop.z;
}
function drawCrop(){
  $('#pf').innerHTML = `<div class="ov"></div><div class="sheet" role="dialog" aria-label="Ajustar foto">
    <div class="sh-h"><button class="x" data-c="cancel">Cancelar</button><b>Ajustar foto</b><button class="ok" data-c="use">Usar</button></div>
    <div class="sh-b"><div class="crw">
      <div class="crs" id="cr-s"><img id="cr-img" src="${crop.url}" alt="" draggable="false"><div class="crm"></div></div>
      <div class="crz"><span>−</span><input type="range" id="cr-z" min="1" max="4" step="0.01" value="${crop.z}" aria-label="Ampliar"><span>+</span></div>
      <p class="hint">Arrastra para mover; pellizca o usa la barra para ampliar.</p>
    </div></div></div>`;
  paintCrop();
  const st = $('#cr-s'), pts = new Map(); let g = null;
  $('#cr-z').addEventListener('input', e=>{ crop.z = +e.target.value; paintCrop(); });
  st.addEventListener('pointerdown', e=>{ st.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const v = [...pts.values()];
    g = v.length === 2 ? { pinch: true, d: Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y), z: crop.z } : { x: e.clientX, y: e.clientY, cx: crop.x, cy: crop.y }; });
  st.addEventListener('pointermove', e=>{ if(!pts.has(e.pointerId) || !g) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const v = [...pts.values()];
    if(g.pinch && v.length === 2){ crop.z = Math.max(1, Math.min(4, g.z * Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y) / g.d)); }
    else if(!g.pinch){ crop.x = g.cx + e.clientX - g.x; crop.y = g.cy + e.clientY - g.y; }
    paintCrop(); });
  const up = e=>{ pts.delete(e.pointerId); const v = [...pts.values()]; g = v.length === 1 ? { x: v[0].x, y: v[0].y, cx: crop.x, cy: crop.y } : null; };
  st.addEventListener('pointerup', up); st.addEventListener('pointercancel', up);
  st.addEventListener('wheel', e=>{ e.preventDefault(); crop.z = Math.max(1, Math.min(4, crop.z * Math.exp(-e.deltaY * .003))); paintCrop(); }, { passive: false });
}
$('#pf').addEventListener('click', e=>{
  const t = e.target.closest('[data-c]'); if(!t || !crop) return;
  if(t.dataset.c === 'use'){
    const out = 240, k = out / CW, c = document.createElement('canvas'); c.width = c.height = out;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, out, out);
    const w = crop.img.width * crop.base * crop.z * k, h = crop.img.height * crop.base * crop.z * k;
    ctx.drawImage(crop.img, out / 2 + crop.x * k - w / 2, out / 2 + crop.y * k - h / 2, w, h);
    pfDraft.photo = c.toDataURL('image/jpeg', .85);
  }
  URL.revokeObjectURL(crop.url); crop = null; drawProfile();
}, true);
function saveProfile(){
  const p = profiles.list.find(x=> x.id === pfDraft.id); p.name = (pfDraft.name || '').trim() || 'Perfil ' + p.id; p.photo = pfDraft.photo || null; p.updated = Date.now();
  saveProfiles(true); drawPTabs(); closeProfile(); toast('Perfil guardado');
}
$('#pf').addEventListener('click', e=>{ const t = e.target.closest('[data-p]'); if(!t) return; const a = t.dataset.p;
  if(a === 'close') closeProfile(); else if(a === 'save') saveProfile(); else if(a === 'nophoto'){ pfDraft.photo = null; drawProfile(); } });
document.addEventListener('paste', e=>{ if(!$('#pf').innerHTML) return; const it = [...((e.clipboardData || {}).items || [])].find(i=> i.type.startsWith('image/')); if(it){ e.preventDefault(); photoFrom(it.getAsFile()); } }, true);

drawPTabs();
render();
setGh(ghOk() ? 'pending' : 'off'); if(ghOk()) sync();
})();
</script>
